<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAYA - منصة العروض والامتحانات</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f3f4f6;
        }
        .avatar-option { cursor: pointer; transition: transform 0.2s; }
        .avatar-option:hover { transform: scale(1.1); }
        .selected-avatar { border: 4px solid #3b82f6; border-radius: 50%; background-color: #eff6ff; }
        
        /* تصميم Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* منع النسخ */
        * {
            -webkit-touch-callout: none;
        }
    </style>

    <!-- React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Excel Export (SheetJS) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- Firebase v9 Compat (CDN) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // إعدادات Firebase الخاصة بك
        const firebaseConfig = {
            apiKey: "AIzaSyAUfiVn9d6ssAXyJebJZE9lHzEXIzf38dc",
            authDomain: "raya-a4bb5.firebaseapp.com",
            projectId: "raya-a4bb5",
            storageBucket: "raya-a4bb5.firebasestorage.app",
            messagingSenderId: "698811790975",
            appId: "1:698811790975:web:9be89e4ecfefd6afe6714a",
            measurementId: "G-CN04VMJKC2"
        };
        
        // التهيئة
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        
        const auth = firebase.auth();
        const db = firebase.firestore();
        const googleProvider = new firebase.auth.GoogleAuthProvider();

        const ADMIN_EMAIL = "abdoo.ashraf353@gmail.com";

        const AVATARS = [
            { id: 1, name: 'سبونج بوب', icon: '🧽', type: 'قاع الهامور' },
            { id: 2, name: 'شفيق', icon: '🦑', type: 'قاع الهامور' },
            { id: 3, name: 'بسيط', icon: '⭐', type: 'قاع الهامور' },
            { id: 4, name: 'جاد جداً', icon: '💼', type: 'جاد' },
            { id: 5, name: 'مضحك', icon: '🤡', type: 'مضحك' }
        ];

        // ==========================================
        // المكون الرئيسي للتطبيق
        // ==========================================
        function App() {
            const [user, setUser] = useState(null);
            const [dbUser, setDbUser] = useState(null);
            const [role, setRole] = useState(null); 
            const [brandInput, setBrandInput] = useState('');
            const [view, setView] = useState('login'); 
            const [loading, setLoading] = useState(true);

            // التحقق من حالة المستخدم (مع مؤقت لتفادي التعليق)
            useEffect(() => {
                const fallbackTimeout = setTimeout(() => {
                    if(loading) {
                        setLoading(false);
                        setView('login');
                    }
                }, 4000); // إجبار الانتقال لشاشة تسجيل الدخول بعد 4 ثوانٍ إذا لم يستجب فايربيز

                const unsubscribe = auth.onAuthStateChanged(async (currentUser) => {
                    clearTimeout(fallbackTimeout);
                    
                    try {
                        if (currentUser) {
                            const email = currentUser.email;
                            
                            // التحقق إذا كان المدير
                            if (email === ADMIN_EMAIL) {
                                setRole('admin');
                                setUser(currentUser);
                                setView('admin');
                                setLoading(false);
                                return;
                            }

                            // إذا كان مستخدم عادي، نجلب بياناته من قاعدة البيانات
                            const userDocRef = db.collection('users').doc(email);
                            const userDoc = await userDocRef.get();
                            
                            if (userDoc.exists) {
                                const data = userDoc.data();
                                if (data.status === 'pending') {
                                    alert("حسابك قيد المراجعة من قبل الإدارة. يرجى الانتظار والمحاولة لاحقاً.");
                                    await auth.signOut();
                                    setUser(null);
                                    setView('login');
                                } else {
                                    setUser(currentUser);
                                    setDbUser(data);
                                    setRole('user');
                                    setView('dashboard');
                                }
                            } else {
                                // حسابه غير موجود في قاعدة البيانات، يجب أن يسجل خروج ليتمكن من التسجيل كجديد مع البراند
                                await auth.signOut();
                                setUser(null);
                                setView('login');
                            }
                        } else {
                            setUser(null);
                            setRole(null);
                            setView('login');
                        }
                    } catch (error) {
                        console.error("خطأ في التحقق من المستخدم:", error);
                        setView('login');
                    } finally {
                        setLoading(false);
                    }
                });
                
                return () => {
                    unsubscribe();
                    clearTimeout(fallbackTimeout);
                };
            }, []);

            const handleGoogleLogin = async () => {
                try {
                    const result = await auth.signInWithPopup(googleProvider);
                    const email = result.user.email;

                    if (email === ADMIN_EMAIL) {
                        return; // onAuthStateChanged سيتعامل مع دخول المدير
                    }

                    const userDocRef = db.collection('users').doc(email);
                    const userDoc = await userDocRef.get();

                    if (!userDoc.exists) {
                        // مستخدم جديد، يجب التأكد أنه أدخل البراند
                        if (!brandInput || brandInput.trim() === '') {
                            alert("يرجى كتابة اسم البراند الخاص بك أولاً قبل تسجيل الدخول.");
                            await auth.signOut();
                            return;
                        }
                        
                        // إنشاء حساب جديد في وضع المراجعة
                        await userDocRef.set({
                            name: result.user.displayName || email.split('@')[0],
                            email: email,
                            brand: brandInput.trim(),
                            status: 'pending',
                            hasExamined: false,
                            score: 0,
                            timeTaken: 0,
                            avatar: '🧽',
                            mistakes: []
                        });
                        alert("تم إرسال طلب التسجيل بنجاح. جاري المراجعة من قبل الإدارة.");
                        await auth.signOut();
                    }
                } catch (error) {
                    console.error("فشل تسجيل الدخول:", error);
                    // تجاهل خطأ إغلاق النافذة المنبثقة
                    if (error.code !== 'auth/popup-closed-by-user') {
                        alert("حدث خطأ أثناء تسجيل الدخول. يرجى التأكد من اتصالك بالإنترنت.");
                    }
                }
            };

            const handleLogout = async () => {
                if(confirm("هل تريد تسجيل الخروج؟")) {
                    await auth.signOut();
                    window.location.reload();
                }
            };

            if (loading) {
                return (
                    <div className="flex flex-col h-screen items-center justify-center bg-gray-50">
                        <div className="w-16 h-16 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4"></div>
                        <div className="text-2xl font-bold text-blue-800">جاري التحميل...</div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col bg-gray-50">
                    {/* الهيدر */}
                    {user && (
                        <div className="bg-white shadow p-4 flex justify-between items-center sticky top-0 z-50">
                            <div className="flex items-center gap-3">
                                <button onClick={handleLogout} className="bg-gray-100 text-gray-700 px-4 py-2 rounded-lg font-semibold hover:bg-gray-200 transition">
                                    خروج
                                </button>
                                {role === 'user' && dbUser?.mistakes?.length > 0 && (
                                    <button 
                                        onClick={() => {
                                            const errorsText = dbUser.mistakes.map(m => `السؤال: ${m.q}\nإجابتك: ${m.userAns}\nالصحيح: ${m.correctAns}`).join('\n\n');
                                            alert("أخطاؤك في الامتحان:\n\n" + errorsText);
                                        }}
                                        className="bg-red-50 text-red-600 px-3 py-2 rounded-lg font-bold hover:bg-red-100 transition shadow-sm border border-red-100"
                                        title="عرض بنك الأخطاء"
                                    >
                                        ❌ بنك الأخطاء
                                    </button>
                                )}
                            </div>
                            <div className="flex items-center gap-2">
                                {role === 'admin' && <span className="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded font-bold">لوحة الإدارة</span>}
                                <h1 className="text-2xl md:text-3xl font-extrabold text-blue-800 tracking-wider">RAYA</h1>
                            </div>
                        </div>
                    )}

                    <main className="flex-grow p-4">
                        {view === 'login' && (
                            <div className="flex flex-col items-center justify-center min-h-[80vh]">
                                <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md text-center border-t-8 border-blue-600">
                                    <h1 className="text-5xl font-extrabold text-blue-800 mb-2">RAYA</h1>
                                    <p className="text-gray-500 mb-8 font-semibold">بوابة العروض والامتحانات للموظفين</p>
                                    
                                    <div className="space-y-5">
                                        <div>
                                            <input 
                                                type="text" 
                                                placeholder="اكتب اسم البراند (للتسجيل لأول مرة)" 
                                                className="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl text-right focus:border-blue-500 focus:bg-white outline-none transition" 
                                                value={brandInput}
                                                onChange={(e) => setBrandInput(e.target.value)}
                                            />
                                        </div>
                                        <button onClick={handleGoogleLogin} className="w-full bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-700 transition shadow-md flex items-center justify-center gap-3">
                                            <svg className="w-6 h-6 bg-white rounded-full p-1 text-blue-600" viewBox="0 0 24 24" fill="currentColor">
                                                <path d="M12.545,10.239v3.821h5.445c-0.712,2.315-2.647,3.972-5.445,3.972c-3.332,0-6.033-2.701-6.033-6.032s2.701-6.032,6.033-6.032c1.498,0,2.866,0.549,3.921,1.453l2.814-2.814C17.503,2.988,15.139,2,12.545,2C7.021,2,2.543,6.477,2.543,12s4.478,10,10.002,10c8.396,0,10.249-7.85,9.426-11.748L12.545,10.239z"/>
                                            </svg>
                                            <span className="text-lg">دخول بواسطة Google</span>
                                        </button>
                                    </div>
                                    <p className="mt-6 text-xs text-gray-400">تأكد من إدخال اسم البراند إذا كانت هذه زيارتك الأولى.</p>
                                </div>
                            </div>
                        )}

                        {view === 'admin' && <AdminPanel />}

                        {view === 'dashboard' && role === 'user' && (
                            <UserDashboard 
                                user={user}
                                dbUser={dbUser}
                                setDbUser={setDbUser}
                                onStartExam={() => setView('exam')}
                            />
                        )}

                        {view === 'exam' && role === 'user' && (
                            <ExamRoom 
                                user={user}
                                onFinish={(score, mistakes, timeTaken) => {
                                    alert(`انتهى الامتحان!\nنتيجتك: ${score} من 6\nالوقت المستغرق: ${timeTaken} ثانية`);
                                    setDbUser(prev => ({...prev, hasExamined: true, score, mistakes, timeTaken}));
                                    setView('dashboard');
                                }}
                            />
                        )}
                    </main>
                </div>
            );
        }

        // ==========================================
        // لوحة تحكم الإدارة
        // ==========================================
        function AdminPanel() {
            const [users, setUsers] = useState([]);
            const [settings, setSettings] = useState({ examActive: false, questionsPool: [], offers: [] });
            const [searchTerm, setSearchTerm] = useState('');

            useEffect(() => {
                const unsubUsers = db.collection('users').onSnapshot(snapshot => {
                    const usersData = [];
                    snapshot.forEach(doc => usersData.push({ id: doc.id, ...doc.data() }));
                    setUsers(usersData);
                });

                const unsubSettings = db.collection('settings').doc('main').onSnapshot(doc => {
                    if (doc.exists) {
                        setSettings(doc.data());
                    } else {
                        // تهيئة الإعدادات إذا لم تكن موجودة
                        db.collection('settings').doc('main').set({ examActive: false, questionsPool: [], offers: [] });
                    }
                });

                return () => { unsubUsers(); unsubSettings(); };
            }, []);

            const toggleExam = async () => {
                try {
                    await db.collection('settings').doc('main').set({ examActive: !settings.examActive }, { merge: true });
                } catch(e) {
                    alert("حدث خطأ أثناء تغيير حالة الامتحان.");
                }
            };

            const startNewExamCycle = async () => {
                if(confirm("تحذير: سيتم تصفير حالة الامتحان لجميع الموظفين المقبولين ليتمكنوا من الامتحان مرة أخرى للعروض الجديدة. هل أنت متأكد؟")) {
                    try {
                        const batch = db.batch();
                        users.forEach(u => {
                            if(u.status === 'active') {
                                const ref = db.collection('users').doc(u.id);
                                batch.update(ref, { hasExamined: false, score: 0, timeTaken: 0, mistakes: [] });
                            }
                        });
                        await batch.commit();
                        alert("تم تصفير حالة الامتحان. يمكن للجميع أداء الامتحان الآن.");
                    } catch(e) {
                        alert("حدث خطأ أثناء تحديث بيانات المستخدمين.");
                    }
                }
            };

            const handleFileUpload = (e, type) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = async (event) => {
                    try {
                        const json = JSON.parse(event.target.result);
                        if(type === 'questionsPool' && (!Array.isArray(json) || json.length < 6)) {
                            alert("ملف الأسئلة يجب أن يحتوي على 6 أسئلة على الأقل.");
                            return;
                        }
                        await db.collection('settings').doc('main').set({ [type]: json }, { merge: true });
                        alert("تم حفظ البيانات بنجاح!");
                        e.target.value = null; // تفريغ حقل الملف
                    } catch (err) {
                        alert("صيغة الملف غير صحيحة، يرجى التأكد أنه ملف JSON سليم.");
                    }
                };
                reader.readAsText(file);
            };

            const updateUserStatus = async (email, newStatus) => {
                try {
                    await db.collection('users').doc(email).update({ status: newStatus });
                } catch(e) {
                    alert("حدث خطأ أثناء تحديث حالة المستخدم.");
                }
            };

            const deleteUser = async (email) => {
                if(confirm("هل أنت متأكد من حذف هذا المستخدم نهائياً؟")) {
                    try {
                        await db.collection('users').doc(email).delete();
                    } catch(e) {
                        alert("حدث خطأ أثناء حذف المستخدم.");
                    }
                }
            };

            const exportToExcel = () => {
                const exportData = users.map(u => ({
                    'الاسم': u.name,
                    'البريد الإلكتروني': u.email,
                    'البراند': u.brand,
                    'الحالة': u.status === 'active' ? 'مقبول' : u.status === 'pending' ? 'مراجعة' : 'مرفوض',
                    'أدى الامتحان؟': u.hasExamined ? 'نعم' : 'لا',
                    'الدرجة': u.score || 0,
                    'الوقت (ثواني)': u.timeTaken || 0
                }));
                const ws = XLSX.utils.json_to_sheet(exportData);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "تقرير الموظفين");
                XLSX.writeFile(wb, `RAYA_Report_${new Date().toLocaleDateString()}.xlsx`);
            };

            const filteredUsers = users.filter(u => 
                (u.name && u.name.includes(searchTerm)) || 
                (u.brand && u.brand.includes(searchTerm))
            );

            return (
                <div className="max-w-7xl mx-auto space-y-6">
                    {/* لوحة التحكم العلوية */}
                    <div className="bg-white p-6 rounded-xl shadow-sm border-t-4 border-blue-800 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800 mb-1">إدارة المنصة</h2>
                            <p className="text-sm text-gray-500">
                                حالة الامتحان الآن: 
                                <span className={settings.examActive ? "text-green-600 font-bold mr-1" : "text-red-600 font-bold mr-1"}>
                                    {settings.examActive ? "مُفعل 🟢" : "مُعطل 🔴"}
                                </span>
                            </p>
                        </div>
                        <div className="flex flex-wrap gap-3">
                            <button onClick={toggleExam} className={`px-6 py-2.5 rounded-lg font-bold text-white transition shadow-sm ${settings.examActive ? 'bg-red-500 hover:bg-red-600' : 'bg-green-500 hover:bg-green-600'}`}>
                                {settings.examActive ? 'إيقاف الامتحان 🔴' : 'تفعيل الامتحان 🟢'}
                            </button>
                            <button onClick={startNewExamCycle} className="px-6 py-2.5 bg-blue-600 text-white font-bold rounded-lg hover:bg-blue-700 shadow-sm border border-blue-700">
                                + إنشاء عرض وامتحان جديد
                            </button>
                        </div>
                    </div>

                    {/* رفع الملفات */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <h3 className="font-bold text-lg mb-2 text-gray-800">رفع العروض الحالية</h3>
                            <p className="text-sm text-gray-500 mb-4">ملف JSON يحتوي على قائمة العروض النصية.</p>
                            <div className="relative border-2 border-dashed border-gray-300 rounded-lg p-4 hover:bg-gray-50 transition text-center cursor-pointer">
                                <span className="text-blue-600 font-bold">اختر ملف .json</span>
                                <input type="file" accept=".json" onChange={(e) => handleFileUpload(e, 'offers')} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                            </div>
                            <div className="mt-3 text-xs text-gray-500">العروض المحفوظة حالياً: {settings.offers?.length || 0} عروض</div>
                        </div>
                        
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                            <h3 className="font-bold text-lg mb-2 text-gray-800">رفع بنك الأسئلة</h3>
                            <p className="text-sm text-gray-500 mb-4">ارفع ملف JSON. سيتم اختيار 6 أسئلة عشوائياً لكل مستخدم.</p>
                            <div className="relative border-2 border-dashed border-gray-300 rounded-lg p-4 hover:bg-gray-50 transition text-center cursor-pointer">
                                <span className="text-blue-600 font-bold">اختر ملف .json</span>
                                <input type="file" accept=".json" onChange={(e) => handleFileUpload(e, 'questionsPool')} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                            </div>
                            <div className="mt-3 text-xs text-gray-500">الأسئلة المحفوظة حالياً: {settings.questionsPool?.length || 0} سؤال</div>
                        </div>
                    </div>

                    {/* جدول الموظفين */}
                    <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                        <div className="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                            <h3 className="text-xl font-bold text-gray-800 flex items-center gap-2">
                                👥 سجل الموظفين
                                <span className="bg-blue-100 text-blue-800 text-sm py-0.5 px-2 rounded-full">{users.length}</span>
                            </h3>
                            <div className="flex flex-wrap gap-3 w-full md:w-auto">
                                <div className="relative w-full md:w-64">
                                    <input 
                                        type="text" 
                                        placeholder="بحث بالاسم أو البراند..." 
                                        className="w-full border p-2.5 rounded-lg pr-10 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 outline-none bg-gray-50 text-sm" 
                                        value={searchTerm}
                                        onChange={(e) => setSearchTerm(e.target.value)} 
                                    />
                                    <span className="absolute right-3 top-3 text-gray-400">🔍</span>
                                </div>
                                <button onClick={exportToExcel} className="bg-green-600 text-white px-5 py-2.5 rounded-lg font-bold hover:bg-green-700 shadow-sm flex items-center gap-2 shrink-0 text-sm">
                                    <span>📊</span> تصدير Excel
                                </button>
                            </div>
                        </div>
                        
                        <div className="overflow-x-auto rounded-lg border border-gray-200">
                            <table className="w-full text-right border-collapse whitespace-nowrap">
                                <thead>
                                    <tr className="bg-gray-50 text-gray-600 text-sm border-b">
                                        <th className="p-4 font-semibold">الاسم</th>
                                        <th className="p-4 font-semibold">البراند</th>
                                        <th className="p-4 font-semibold">الحالة</th>
                                        <th className="p-4 font-semibold">أدى الامتحان؟</th>
                                        <th className="p-4 font-semibold">الدرجة</th>
                                        <th className="p-4 font-semibold text-center">الإجراءات</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredUsers.length === 0 ? (
                                        <tr><td colSpan="6" className="p-8 text-center text-gray-500">لا يوجد موظفين مسجلين مطابقين للبحث.</td></tr>
                                    ) : (
                                        filteredUsers.map((u, i) => (
                                            <tr key={u.id} className="border-b last:border-0 hover:bg-blue-50/50 transition">
                                                <td className="p-4">
                                                    <div className="font-bold text-gray-800">{u.name}</div>
                                                    <div className="text-xs text-gray-500">{u.email}</div>
                                                </td>
                                                <td className="p-4"><span className="bg-gray-100 text-gray-700 px-2 py-1 rounded text-sm font-medium">{u.brand}</span></td>
                                                <td className="p-4">
                                                    {u.status === 'pending' && <span className="bg-yellow-100 text-yellow-800 px-2.5 py-1 rounded-md text-xs font-bold border border-yellow-200">⏳ مراجعة</span>}
                                                    {u.status === 'active' && <span className="bg-green-100 text-green-800 px-2.5 py-1 rounded-md text-xs font-bold border border-green-200">✅ مقبول</span>}
                                                </td>
                                                <td className="p-4">
                                                    {u.hasExamined ? 
                                                        <span className="text-green-600 font-bold text-sm bg-green-50 px-2 py-1 rounded">نعم</span> : 
                                                        <span className="text-gray-400 font-medium text-sm">لا</span>}
                                                </td>
                                                <td className="p-4">
                                                    {u.hasExamined ? (
                                                        <div>
                                                            <div className="text-blue-700 font-extrabold">{u.score}/6</div>
                                                            <div className="text-xs text-gray-500">{u.timeTaken} ثانية</div>
                                                        </div>
                                                    ) : '-'}
                                                </td>
                                                <td className="p-4">
                                                    <div className="flex gap-2 justify-center">
                                                        {u.status === 'pending' && (
                                                            <button onClick={() => updateUserStatus(u.email, 'active')} className="bg-blue-50 text-blue-600 px-3 py-1.5 rounded text-sm font-bold hover:bg-blue-100 border border-blue-200">قبول</button>
                                                        )}
                                                        <button onClick={() => deleteUser(u.email)} className="bg-red-50 text-red-600 px-3 py-1.5 rounded text-sm font-bold hover:bg-red-100 border border-red-200">حذف</button>
                                                    </div>
                                                </td>
                                            </tr>
                                        ))
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // شاشة المستخدم (Dashboard)
        // ==========================================
        function UserDashboard({ user, dbUser, setDbUser, onStartExam }) {
            const [settings, setSettings] = useState({ examActive: false, offers: [] });
            const [leaderboard, setLeaderboard] = useState([]);

            useEffect(() => {
                const unsubSettings = db.collection('settings').doc('main').onSnapshot(doc => {
                    if(doc.exists) setSettings(doc.data());
                });

                const unsubLeaderboard = db.collection('users')
                    .where('status', '==', 'active')
                    .where('hasExamined', '==', true)
                    .onSnapshot(snapshot => {
                        let usersData = [];
                        snapshot.forEach(doc => usersData.push(doc.data()));
                        // الترتيب: الدرجة الأعلى، ثم الوقت الأقل
                        usersData.sort((a, b) => b.score - a.score || a.timeTaken - b.timeTaken);
                        setLeaderboard(usersData);
                    });

                return () => { unsubSettings(); unsubLeaderboard(); };
            }, []);

            const changeAvatar = async (icon) => {
                setDbUser({...dbUser, avatar: icon});
                try {
                    await db.collection('users').doc(user.email).update({ avatar: icon });
                } catch(e) {
                    console.error("فشل تحديث الأفاتار");
                }
            };

            const myRank = leaderboard.findIndex(u => u.email === user.email) + 1;

            return (
                <div className="max-w-4xl mx-auto space-y-6">
                    {/* معلومات الموظف واختيار الأفاتار */}
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                        <div className="flex flex-col md:flex-row items-center gap-6 justify-between border-b pb-6 mb-6">
                            <div className="text-center md:text-right">
                                <h2 className="text-2xl font-bold text-gray-800">مرحباً، {dbUser.name} 👋</h2>
                                <p className="text-blue-600 font-semibold bg-blue-50 inline-block px-3 py-1 rounded-full mt-2">براند: {dbUser.brand}</p>
                            </div>
                            <div className="text-6xl bg-gray-50 p-4 rounded-full border-4 border-blue-100 shadow-sm">
                                {dbUser.avatar}
                            </div>
                        </div>

                        <div className="text-center">
                            <h3 className="font-bold text-gray-600 mb-4">اختر شخصيتك المفضلة</h3>
                            <div className="flex flex-wrap justify-center gap-4 text-4xl">
                                {AVATARS.map(av => (
                                    <div 
                                        key={av.id} 
                                        onClick={() => changeAvatar(av.icon)} 
                                        className={`avatar-option p-3 rounded-2xl ${dbUser.avatar === av.icon ? 'selected-avatar shadow-md' : 'bg-gray-50 hover:bg-gray-100'}`} 
                                        title={av.name}
                                    >
                                        {av.icon}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* لوحة العروض وبدء الامتحان */}
                    <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border-t-4 border-blue-600">
                        <h2 className="text-2xl font-extrabold mb-6 text-gray-800 flex items-center justify-center gap-2">
                            📢 العروض الحالية
                        </h2>
                        
                        <div className="mb-8 min-h-[120px] bg-blue-50/50 border border-blue-100 rounded-xl flex flex-col p-6 shadow-inner">
                            {settings.offers && settings.offers.length > 0 ? (
                                <ul className="text-right w-full space-y-3">
                                    {settings.offers.map((offer, idx) => (
                                        <li key={idx} className="font-semibold text-gray-700 flex items-start gap-3">
                                            <span className="text-blue-500 mt-1">📌</span>
                                            <span className="text-lg leading-relaxed">{offer.title || offer.text || JSON.stringify(offer)}</span>
                                        </li>
                                    ))}
                                </ul>
                            ) : (
                                <div className="text-gray-500 font-bold text-center m-auto">لا توجد عروض مضافة حالياً. يرجى الانتظار.</div>
                            )}
                        </div>

                        <div className="text-center">
                            {dbUser.hasExamined ? (
                                <div className="inline-block p-4 bg-green-50 text-green-700 border border-green-200 rounded-xl font-bold text-lg shadow-sm">
                                    ✅ لقد قمت بأداء الامتحان المخصص لهذه العروض بنجاح.
                                </div>
                            ) : (
                                <div className="space-y-4">
                                    <p className="text-sm text-gray-500">اقرأ العروض جيداً، بمجرد بدء الامتحان سيبدأ العداد ولا يمكنك التراجع.</p>
                                    <button 
                                        onClick={onStartExam}
                                        disabled={!settings.examActive}
                                        className={`px-8 py-4 rounded-xl font-bold text-white text-xl w-full md:w-2/3 mx-auto shadow-md transition-all ${settings.examActive ? 'bg-blue-600 hover:bg-blue-700 transform hover:-translate-y-1' : 'bg-gray-300 text-gray-500 cursor-not-allowed border border-gray-300'}`}
                                    >
                                        {settings.examActive ? 'قرأت العروض.. ابدأ الامتحان' : '🔒 الامتحان مغلق حالياً من الإدارة'}
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>

                    {/* لوحة الشرف */}
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 relative overflow-hidden">
                        <div className="absolute top-0 right-0 w-32 h-32 bg-yellow-100 rounded-full blur-3xl opacity-50 -z-10"></div>
                        <h2 className="text-2xl font-bold text-center text-yellow-800 mb-6 flex items-center justify-center gap-2">
                            🏆 لوحة الشرف والأوائل
                        </h2>
                        
                        {dbUser.hasExamined && myRank > 0 && (
                            <div className="mb-6 text-center font-bold text-blue-800 text-lg bg-blue-50 py-3 rounded-xl border border-blue-200 shadow-sm">
                                ترتيبك الحالي هو: المركز {myRank} 🌟
                            </div>
                        )}

                        <div className="space-y-3">
                            {leaderboard.length === 0 && <p className="text-center text-gray-400 py-4">لا توجد نتائج مسجلة حتى الآن.</p>}
                            {leaderboard.map((u, idx) => {
                                let rowClass = "bg-white border-gray-100";
                                let rankIcon = "";
                                if (idx === 0) { rowClass = "bg-yellow-50 border-yellow-400 text-yellow-900 shadow-sm"; rankIcon = "🥇"; }
                                else if (idx === 1) { rowClass = "bg-gray-100 border-gray-300 text-gray-800"; rankIcon = "🥈"; }
                                else if (idx === 2) { rowClass = "bg-orange-50 border-orange-300 text-orange-900"; rankIcon = "🥉"; }

                                return (
                                    <div key={idx} className={`flex items-center justify-between p-4 font-bold rounded-xl border-2 transition ${rowClass}`}>
                                        <div className="flex items-center gap-3">
                                            <span className="text-xl w-8 text-center">{rankIcon || (idx + 1)}</span>
                                            <span className="text-3xl bg-white p-1 rounded-full shadow-sm">{u.avatar}</span>
                                            <div>
                                                <div className="text-lg">{u.name}</div>
                                                <div className="text-xs opacity-75">{u.brand}</div>
                                            </div>
                                        </div>
                                        <div className="text-left bg-white/50 px-3 py-1 rounded-lg">
                                            <div className="text-lg text-blue-700 font-black">{u.score}/6</div>
                                            <div className="text-xs">⏱ {u.timeTaken} ث</div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // محرك الامتحان
        // ==========================================
        function ExamRoom({ user, onFinish }) {
            const [questions, setQuestions] = useState([]);
            const [answers, setAnswers] = useState({});
            const [countdown, setCountdown] = useState(3); // عد تنازلي للبدء
            const [timeLeft, setTimeLeft] = useState(300); // 5 دقائق = 300 ثانية
            const [started, setStarted] = useState(false);
            const warnings = useRef(0);
            const initialTime = 300;
            const [loadingError, setLoadingError] = useState(false);

            useEffect(() => {
                db.collection('settings').doc('main').get().then(doc => {
                    if(doc.exists && doc.data().questionsPool && doc.data().questionsPool.length >= 6) {
                        const pool = doc.data().questionsPool;
                        // خلط الأسئلة واختيار 6 عشوائياً
                        const shuffled = [...pool].sort(() => 0.5 - Math.random()).slice(0, 6);
                        
                        // خلط ترتيب الإجابات داخل كل سؤال
                        const processedQuestions = shuffled.map(q => {
                            const optionsWithIndex = q.options.map((opt, index) => ({ text: opt, originalIndex: index }));
                            const shuffledOptions = optionsWithIndex.sort(() => 0.5 - Math.random());
                            
                            // إيجاد الـ index الجديد للإجابة الصحيحة
                            const newCorrectIndex = shuffledOptions.findIndex(o => o.originalIndex === q.correct);
                            
                            return {
                                question: q.question,
                                options: shuffledOptions.map(o => o.text),
                                correct: newCorrectIndex,
                                originalOptions: q.options,
                                originalCorrectIndex: q.correct
                            };
                        });

                        setQuestions(processedQuestions);
                    } else {
                        setLoadingError(true);
                    }
                }).catch(() => setLoadingError(true));
            }, []);

            // عداد البدء
            useEffect(() => {
                if (!loadingError && questions.length > 0) {
                    if (countdown > 0) {
                        const t = setTimeout(() => setCountdown(countdown - 1), 1000);
                        return () => clearTimeout(t);
                    } else {
                        setStarted(true);
                    }
                }
            }, [countdown, questions, loadingError]);

            // مؤقت الامتحان الفعلي
            useEffect(() => {
                if (started && timeLeft > 0) {
                    const t = setTimeout(() => setTimeLeft(timeLeft - 1), 1000);
                    return () => clearTimeout(t);
                } else if (started && timeLeft === 0) {
                    submitExam();
                }
            }, [started, timeLeft]);

            // منع الغش (الخروج من الصفحة أو فقدان التركيز)
            useEffect(() => {
                const handleVisibilityAndFocus = () => {
                    if ((document.hidden || !document.hasFocus()) && started) {
                        warnings.current += 1;
                        if (warnings.current === 1) {
                            alert("⚠️ تحذير صارم: يمنع الخروج من صفحة الامتحان أو فتح نوافذ أخرى أو تقسيم الشاشة. إذا تكرر ذلك سيتم تسليم الامتحان تلقائياً بدرجة صفر!");
                        } else if (warnings.current >= 2) {
                            alert("🚫 تم تسليم الامتحان تلقائياً بدرجة صفر لمخالفتك قواعد المراقبة (الخروج من الشاشة مرتين).");
                            forceSubmitZero();
                        }
                    }
                };
                
                // إضافة أحداث لمنع السحب والنسخ والكليك يمين
                const disableContext = (e) => e.preventDefault();
                
                window.addEventListener('blur', handleVisibilityAndFocus);
                document.addEventListener('visibilitychange', handleVisibilityAndFocus);
                document.addEventListener('contextmenu', disableContext);
                
                return () => {
                    window.removeEventListener('blur', handleVisibilityAndFocus);
                    document.removeEventListener('visibilitychange', handleVisibilityAndFocus);
                    document.removeEventListener('contextmenu', disableContext);
                };
            }, [started]);

            const forceSubmitZero = async () => {
                const timeTaken = initialTime - timeLeft;
                try {
                    await db.collection('users').doc(user.email).update({
                        hasExamined: true, score: 0, timeTaken: timeTaken, mistakes: []
                    });
                } catch(e) {}
                onFinish(0, [], timeTaken);
            };

            const submitExam = async () => {
                let score = 0;
                let mistakes = [];
                questions.forEach((q, idx) => {
                    const userAnsIdx = answers[idx];
                    if (userAnsIdx === q.correct) {
                        score += 1;
                    } else {
                        mistakes.push({ 
                            q: q.question, 
                            correctAns: q.options[q.correct], 
                            userAns: userAnsIdx !== undefined ? q.options[userAnsIdx] : "لم يُجب" 
                        });
                    }
                });

                const timeTaken = initialTime - timeLeft;
                
                try {
                    await db.collection('users').doc(user.email).update({
                        hasExamined: true,
                        score: score,
                        timeTaken: timeTaken,
                        mistakes: mistakes
                    });
                } catch(e) {
                    alert("تحذير: قد يكون حدث خطأ في حفظ النتيجة بسبب مشاكل الاتصال.");
                }

                onFinish(score, mistakes, timeTaken);
            };

            const handleAnswerSelect = (qIdx, optIdx) => {
                setAnswers({...answers, [qIdx]: optIdx});
            };

            if (loadingError) {
                return (
                    <div className="flex flex-col items-center mt-20 p-6 text-center">
                        <div className="text-4xl mb-4">⚠️</div>
                        <h2 className="text-xl font-bold text-red-600 mb-2">عذراً، الامتحان غير جاهز!</h2>
                        <p className="text-gray-600">لا يوجد عدد كافي من الأسئلة في بنك الأسئلة. يرجى مراجعة الإدارة.</p>
                        <button onClick={() => window.location.reload()} className="mt-6 bg-blue-600 text-white px-6 py-2 rounded-lg">العودة للرئيسية</button>
                    </div>
                );
            }

            if (!started) return (
                <div className="flex flex-col justify-center items-center h-[80vh]">
                    <div className="bg-white p-12 rounded-full shadow-2xl border-8 border-blue-100 flex flex-col items-center justify-center w-64 h-64">
                        <h2 className="text-blue-500 text-xl font-bold mb-2">استعد...</h2>
                        <h1 className="text-8xl text-blue-700 font-extrabold animate-pulse">{countdown}</h1>
                    </div>
                </div>
            );

            return (
                <div className="max-w-3xl mx-auto pb-24">
                    {/* شريط المراقبة والوقت الثابت */}
                    <div className="bg-white p-4 rounded-xl shadow-lg mb-6 sticky top-2 z-50 border-b-4 border-blue-600 flex justify-between items-center bg-opacity-95 backdrop-blur">
                        <div className="flex items-center gap-2">
                            <span className="animate-ping w-2 h-2 rounded-full bg-red-600"></span>
                            <h2 className="text-lg font-extrabold text-blue-900 hidden md:block">امتحان RAYA</h2>
                        </div>
                        
                        <div className="flex items-center gap-4">
                            <div className="text-sm font-bold text-gray-500">تمت الإجابة: {Object.keys(answers).length}/6</div>
                            <div className={`text-2xl font-mono font-bold px-4 py-1.5 rounded-lg border-2 ${timeLeft < 60 ? 'text-red-600 bg-red-50 border-red-200 animate-pulse' : 'text-blue-700 bg-blue-50 border-blue-100'}`}>
                                ⏱ {Math.floor(timeLeft / 60)}:{('0' + (timeLeft % 60)).slice(-2)}
                            </div>
                        </div>
                    </div>

                    {/* قائمة الأسئلة */}
                    <div className="space-y-8">
                        {questions.map((q, idx) => (
                            <div key={idx} className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-100">
                                <h3 className="text-xl font-bold mb-6 text-gray-800 leading-relaxed flex gap-3">
                                    <span className="bg-blue-100 text-blue-800 w-8 h-8 flex items-center justify-center rounded-full shrink-0">{idx + 1}</span>
                                    <span>{q.question}</span>
                                </h3>
                                <div className="space-y-3 pl-2 md:pl-8">
                                    {q.options.map((opt, optIdx) => (
                                        <div 
                                            key={optIdx} 
                                            onClick={() => handleAnswerSelect(idx, optIdx)}
                                            className={`flex items-center p-4 rounded-xl border-2 cursor-pointer transition-all ${answers[idx] === optIdx ? 'bg-blue-50 border-blue-500 shadow-md ring-2 ring-blue-200' : 'border-gray-200 bg-gray-50 hover:bg-gray-100 hover:border-gray-300'}`}
                                        >
                                            <div className={`w-6 h-6 rounded-full border-2 ml-4 flex items-center justify-center shrink-0 ${answers[idx] === optIdx ? 'border-blue-600' : 'border-gray-400'}`}>
                                                {answers[idx] === optIdx && <div className="w-3 h-3 bg-blue-600 rounded-full"></div>}
                                            </div>
                                            <span className={`text-lg font-medium ${answers[idx] === optIdx ? 'text-blue-800' : 'text-gray-700'}`}>{opt}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>

                    {/* زر التسليم */}
                    <div className="fixed bottom-0 left-0 right-0 p-4 bg-white border-t border-gray-200 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.1)] z-40">
                        <div className="max-w-3xl mx-auto flex gap-4">
                            <button 
                                onClick={() => {
                                    const answeredCount = Object.keys(answers).length;
                                    if(answeredCount < 6) {
                                        if(!confirm(`لقد أجبت على ${answeredCount} أسئلة فقط من أصل 6. هل أنت متأكد من تسليم الامتحان الآن؟`)) return;
                                    } else {
                                        if(!confirm("هل أنت متأكد من مراجعة الإجابات وتسليم الامتحان؟")) return;
                                    }
                                    submitExam();
                                }}
                                className="w-full bg-green-500 hover:bg-green-600 text-white font-extrabold text-xl py-4 rounded-xl shadow-lg transition-transform transform active:scale-95"
                            >
                                تسليم الإجابات النهائية
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
