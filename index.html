<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>RAYA - العروض المتاحة حاليا</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          raya: {
            50: '#e6ebf5', 100: '#ccd7eb', 200: '#99b0d6', 300: '#6688c2', 400: '#3361ad',
            500: '#0033A0', 600: '#002980', 700: '#001f60', 800: '#001440', 900: '#000a20',
          }
        }
      }
    }
  }
</script>
<style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; color: #0f172a; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    @media print { .exam-protected { display: none !important; } }
    .exam-protected { -webkit-touch-callout: none; -webkit-user-select: none; -khtml-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const firebaseConfig = { apiKey: "AIzaSyAkSD8k1Q4_gSwar3mwfDPVpUPWzHJevNk", authDomain: "geox-platform.firebaseapp.com", databaseURL: "https://geox-platform-default-rtdb.firebaseio.com", projectId: "geox-platform", storageBucket: "geox-platform.firebasestorage.app", messagingSenderId: "691272759644", appId: "1:691272759644:web:297e11465b2fbe83ef6999", measurementId: "G-HVEFX0HGMM" };
if(!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
    firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);
}
const auth = firebase.auth(); const db = firebase.firestore(); const googleProvider = new firebase.auth.GoogleAuthProvider();
googleProvider.setCustomParameters({ prompt: 'select_account' });

const ADMIN_EMAILS = ["abdoo.ashraf353@gmail.com", "yousef74joe74@gmail.com"];
const AVATARS = [ {id:1, src:'avatar1.png'}, {id:2, src:'avatar2.png'}, {id:3, src:'avatar3.png'}, {id:4, src:'avatar4.png'}, {id:5, src:'avatar5.png'} ];

const RenderAvatar = ({ avatarValue, sizeClass="w-12 h-12" }) => {
    const defaultImg = "https://cdn-icons-png.flaticon.com/512/149/149071.png";
    let src = avatarValue || 'avatar1.png';
    if(src.length < 5 && src.match(/[\p{Emoji}]/u)) return <div className={`flex items-center justify-center text-raya-600 ${sizeClass}`}><span style={{fontSize:'150%'}}>{src}</span></div>;
    return <img src={src} alt="User" className={`${sizeClass} object-contain drop-shadow-sm transition-transform`} onError={e=>e.target.src=defaultImg}/>;
};

const CompanyLogo = ({ className }) => (
    <div className="flex items-center justify-center">
        <img src="logo.png" alt="RAYA" className={className} onError={(e)=>{e.target.style.display='none'; e.target.nextSibling.style.display='block';}} />
        <span className={`font-black text-raya-800 tracking-wider hidden ${className}`}>RAYA</span>
    </div>
);

function App() {
    const [user, setUser] = useState(null); const [dbUser, setDbUser] = useState(null); const [role, setRole] = useState(null); 
    const [nameInput, setNameInput] = useState(''); const [brandInput, setBrandInput] = useState(''); 
    const [view, setView] = useState('login'); const [loading, setLoading] = useState(true);
    
    useEffect(() => {
        const timer = setTimeout(() => { if(loading) setLoading(false); }, 8000);
        const unsubscribe = auth.onAuthStateChanged(async (currentUser) => {
            try {
                if(currentUser) {
                    const email = currentUser.email;
                    if(ADMIN_EMAILS.includes(email)) { setRole('admin'); setUser(currentUser); setView('admin'); setLoading(false); return; }
                    const userDoc = await db.collection('users').doc(email).get();
                    if(userDoc.exists) { setUser(currentUser); setDbUser(userDoc.data()); setRole('user'); setView('dashboard'); }
                } else { setUser(null); setRole(null); setView('login'); }
            } catch(error) { console.error(error); setView('login'); } finally { setLoading(false); clearTimeout(timer); }
        });
        return () => { unsubscribe(); clearTimeout(timer); };
    }, []);

    const handleGoogleLogin = async () => {
        try {
            setLoading(true); const result = await auth.signInWithPopup(googleProvider); const email = result.user.email;
            if(ADMIN_EMAILS.includes(email)) { setRole('admin'); setUser(result.user); setView('admin'); setLoading(false); return; }
            
            const userDocRef = db.collection('users').doc(email); const userDoc = await userDocRef.get();
            if(!userDoc.exists) {
                if(!nameInput.trim() || !brandInput.trim()) { 
                    alert("تنبيه: يجب كتابة (الاسم ثلاثي) و (اسم البراند) أولاً قبل التسجيل لتفعيل حسابك."); 
                    await auth.signOut(); setLoading(false); return; 
                }
                const newData = { name: nameInput.trim(), email: email, brand: brandInput.trim(), status: 'active', hasExamined: false, score: 0, maxScore: 6, timeTaken: 0, avatar: 'avatar1.png', mistakes: [], allAnswers: [], lastExamType: 'closed', selfishnessScore: 0 };
                await userDocRef.set(newData);
                setDbUser(newData); setUser(result.user); setRole('user'); setView('dashboard');
            } else {
                setDbUser(userDoc.data()); setUser(result.user); setRole('user'); setView('dashboard');
            }
        } catch(error) { if(error.code !== 'auth/popup-closed-by-user') alert("خطأ في الاتصال. تأكد من الإنترنت."); } finally { setLoading(false); }
    };

    const handleLogout = async () => { if(window.confirm("هل تريد تسجيل الخروج؟")) { await auth.signOut(); window.location.reload(); } };
    
    if(loading) return <div className="flex flex-col h-screen items-center justify-center bg-slate-50"><div className="w-10 h-10 border-4 border-raya-500 border-t-transparent rounded-full animate-spin mb-3"></div><div className="text-raya-800 font-bold text-sm animate-pulse">جاري التحميل...</div></div>;

    return (
        <div className="min-h-screen flex flex-col bg-slate-50">
            {user && (
                <header className="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
                    <div className="max-w-7xl mx-auto px-4 py-2 flex justify-between items-center">
                        <div className="flex gap-2 items-center">
                            <button onClick={handleLogout} className="text-xs font-bold text-slate-600 hover:text-slate-900 bg-slate-100 px-3 py-1.5 rounded transition-colors border border-slate-200">خروج</button>
                            {role === 'user' && dbUser?.lastExamType !== 'softSkills' && dbUser?.mistakes?.length > 0 && <button onClick={() => alert("مراجعة الأخطاء السابقة:\n\n" + dbUser.mistakes.map(m => `السؤال: ${m.q}\nإجابتك: ${m.userAns}\nالصحيح: ${m.correctAns}`).join('\n\n---\n'))} className="text-xs font-bold text-rose-600 bg-rose-50 px-3 py-1.5 rounded transition-colors border border-rose-200 flex items-center gap-1"> بنك أخطائي</button>}
                        </div>
                        <div className="flex items-center gap-3">
                            {role === 'admin' && <span className="bg-raya-100 text-raya-800 text-[10px] font-bold px-2 py-1 rounded border border-raya-200">مدير النظام</span>}
                            <CompanyLogo className="h-6 md:h-8 object-contain" />
                        </div>
                    </div>
                </header>
            )}
            
            <main className="flex-grow p-3 md:p-6">
                {view === 'login' && (
                    <div className="flex flex-col items-center justify-center min-h-[85vh] fade-in">
                        <div className="bg-white p-6 md:p-8 rounded-2xl shadow-lg border border-slate-100 w-full max-w-sm text-center relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-full h-1 bg-raya-500"></div>
                            <CompanyLogo className="h-12 mx-auto mb-4 object-contain" />
                            <p className="text-raya-800 font-bold text-base mb-6">العروض والتحديثات المتاحة</p>
                            
                            <div className="space-y-4">
                                <div className="text-right">
                                    <label className="block text-xs font-bold text-slate-700 mb-1">الاسم ثلاثي</label>
                                    <input type="text" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-1 focus:ring-raya-500 outline-none text-sm font-medium text-slate-800" value={nameInput} onChange={e => setNameInput(e.target.value)} />
                                </div>
                                <div className="text-right">
                                    <label className="block text-xs font-bold text-slate-700 mb-1">اسم البراند</label>
                                    <input type="text" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-1 focus:ring-raya-500 outline-none text-sm font-medium text-slate-800" value={brandInput} onChange={e => setBrandInput(e.target.value)} />
                                </div>
                                <button onClick={handleGoogleLogin} className="w-full bg-raya-500 text-white font-bold py-3 rounded-lg shadow hover:bg-raya-600 transition flex items-center justify-center gap-2 active:scale-95 text-sm border border-raya-600 mt-2">
                                    تسجيل دخول
                                </button>
                            </div>
                            <p className="mt-4 text-[10px] font-semibold text-slate-400 bg-slate-50 p-2 rounded leading-relaxed">تنبيه: إذا كنت موظفاً جديداً املأ البيانات أولاً. إذا كنت مسجلاً مسبقاً، اترك الخانات فارغة واضغط تسجيل دخول.</p>
                        </div>
                    </div>
                )}
                {view === 'admin' && <AdminPanel />}
                {view === 'dashboard' && role === 'user' && <UserDashboard user={user} dbUser={dbUser} setDbUser={setDbUser} onStartExam={() => setView('exam')} />}
                {view === 'exam' && role === 'user' && <ExamRoom user={user} onFinish={(s,m,t,max,type,allAns, selfishnessScore) => { 
                    if(type === 'softSkills') {
                        alert(`تم تسجيل إجاباتك ومواقفك بنجاح في قاعدة البيانات.`);
                    } else {
                        alert(`تم الاعتماد بنجاح!\n\nالنتيجة النهائية: ${s} من ${max}\nالوقت المستغرق: ${t} ثانية`); 
                    }
                    setDbUser(p=>({...p,hasExamined:true,score:s,maxScore:max,mistakes:m,timeTaken:t, lastExamType:type, allAnswers:allAns, selfishnessScore: selfishnessScore})); 
                    setView('dashboard'); 
                }} />}
            </main>
        </div>
    );
}

function AdminPanel() {
    const [users, setUsers] = useState([]); const [settings, setSettings] = useState({examType:'closed',questionsPool:[],softSkillsPool:[],offers:[]}); 
    const [search, setSearch] = useState('');
    const [offersJSON, setOffersJSON] = useState('');
    const [questionsJSON, setQuestionsJSON] = useState('');
    const [softSkillsJSON, setSoftSkillsJSON] = useState('');
    const [mistakesModal, setMistakesModal] = useState(null);
    const [answersModal, setAnswersModal] = useState(null);

    useEffect(() => {
        db.collection('users').onSnapshot(s => setUsers(s.docs.map(d => ({id:d.id,...d.data()}))));
        db.collection('settings').doc('main').onSnapshot(d => {
            if(d.exists) {
                const data = d.data(); setSettings(data);
                if(!offersJSON) setOffersJSON(JSON.stringify(data.offers || [], null, 2));
                if(!questionsJSON) setQuestionsJSON(JSON.stringify(data.questionsPool || [], null, 2));
                if(!softSkillsJSON) setSoftSkillsJSON(JSON.stringify(data.softSkillsPool || [], null, 2));
            } else db.collection('settings').doc('main').set({examType:'closed',questionsPool:[],softSkillsPool:[],offers:[]});
        });
    }, []);

    const setExamMode = (mode) => db.collection('settings').doc('main').update({examType: mode});
    
    const startNewExam = async () => {
        if(window.confirm("تأكيد: سيتم تصفير جميع النتائج وإلغاء إجابات الموظفين الحالية للتقييم الجديد؟")) {
            const batch = db.batch();
            users.forEach(u => { if(u.status === 'active') batch.update(db.collection('users').doc(u.id), { hasExamined: false, score: 0, timeTaken: 0, mistakes: [], allAnswers: [], selfishnessScore: 0 }); });
            await batch.commit(); alert("تم تصفير النتائج بنجاح!");
        }
    };

    const saveJSON = async (type) => {
        try {
            const raw = type === 'offers' ? offersJSON : type === 'questionsPool' ? questionsJSON : softSkillsJSON;
            const parsed = JSON.parse(raw);
            if(type === 'questionsPool' && (!Array.isArray(parsed) || parsed.length < 6)) { alert("خطأ: يجب أن يحتوي بنك أسئلة العروض على 6 أسئلة على الأقل."); return; }
            if(type === 'softSkillsPool' && (!Array.isArray(parsed) || parsed.length < 4)) { alert("خطأ: يجب أن يحتوي بنك السوفت سكيلز على 4 مواقف على الأقل."); return; }
            await db.collection('settings').doc('main').update({ [type]: JSON.parse(JSON.stringify(parsed)) });
            alert("تم الحفظ في قاعدة البيانات بنجاح!");
        } catch(e) { alert("خطأ في صيغة الـ JSON! يرجى المراجعة."); }
    };

    // إصلاح مشكلة الإكسيل جذرياً
    const exportEx = () => { 
        const activeU = users.filter(u => u.status === 'active');
        const wb = XLSX.utils.book_new();
        
        if(settings.examType === 'softSkills') {
            const formattedData = activeU.map(u => {
                let row = { 'الاسم': u.name, 'البريد': u.email, 'البراند': u.brand, 'أدى التقييم': u.hasExamined ? 'نعم' : 'لا', 'مؤشر الأنانية (%)': u.hasExamined ? (u.selfishnessScore || 0) + '%' : '-' };
                if (u.hasExamined && u.allAnswers) {
                    u.allAnswers.forEach((ans, i) => { 
                        row[`موقف ${i+1}`] = ans.q; 
                        row[`إجابته ${i+1}`] = ans.userAns; 
                        row[`أنانية الإجابة ${i+1}`] = (ans.selfishness || 0) + '%';
                    });
                }
                return row;
            });
            const ws = XLSX.utils.json_to_sheet(formattedData);
            XLSX.utils.book_append_sheet(wb, ws, "مواقف السوفت سكيلز");
            XLSX.writeFile(wb, "SoftSkills_Report.xlsx"); 
        } else {
            const formattedData = activeU.map(u => ({ 'الاسم': u.name, 'البريد': u.email, 'البراند': u.brand, 'أدى الامتحان': u.hasExamined ? 'نعم' : 'لا', 'الدرجة': u.hasExamined ? `${u.score}/${u.maxScore||6}` : '-', 'الوقت (ثواني)': u.hasExamined ? u.timeTaken : '-' }));
            const ws = XLSX.utils.json_to_sheet(formattedData);
            XLSX.utils.book_append_sheet(wb, ws, "نتائج العروض");
            XLSX.writeFile(wb, "Offers_Report.xlsx"); 
        }
    };

    const activeUsers = users.filter(u => (u.name.includes(search) || u.brand.includes(search)) && u.status === 'active');
    const pendingUsers = users.filter(u => u.status === 'pending');
    
    let qMistakes = {}; let catMistakes = {};
    activeUsers.forEach(u => {
        if(u.mistakes && settings.examType !== 'softSkills') {
            u.mistakes.forEach(m => {
                qMistakes[m.q] = (qMistakes[m.q] || 0) + 1;
                const cat = m.category || 'عام';
                catMistakes[cat] = (catMistakes[cat] || 0) + 1;
            });
        }
    });
    const sortedQ = Object.entries(qMistakes).sort((a,b)=>b[1]-a[1]);
    const sortedCat = Object.entries(catMistakes).sort((a,b)=>b[1]-a[1]);
    const topQ = sortedQ.length > 0 ? sortedQ[0] : null;
    const topCat = sortedCat.length > 0 ? sortedCat[0] : null;

    return (
        <div className="max-w-6xl mx-auto space-y-5 fade-in">
            <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4">
                <div className="text-center md:text-right">
                    <h2 className="text-xl font-bold text-raya-800 mb-2">لوحة تحكم الإدارة</h2>
                    <div className="flex items-center justify-center md:justify-start gap-1 text-[11px] font-bold bg-slate-50 px-3 py-1.5 rounded border border-slate-100">
                        الوضع الحالي: <span className={`flex items-center gap-1.5 ${settings.examType !== 'closed'?'text-emerald-600':'text-rose-600'}`}>
                            <span className={`w-2 h-2 rounded-full ${settings.examType !== 'closed'?'bg-emerald-500 animate-pulse':'bg-rose-500'}`}></span>
                            {settings.examType === 'offers' ? 'امتحان العروض مفعل' : settings.examType === 'softSkills' ? 'امتحان السوفت سكيلز مفعل' : 'الامتحانات مغلقة'}
                        </span>
                    </div>
                </div>
                <div className="flex gap-2 flex-wrap justify-center bg-slate-50 p-2 rounded-lg border border-slate-100">
                    <button onClick={()=>setExamMode('offers')} className={`px-4 py-2 rounded-md text-xs font-bold shadow-sm transition-all border ${settings.examType === 'offers' ? 'bg-raya-600 text-white border-raya-700' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-100'}`}>تفعيل العروض</button>
                    <button onClick={()=>setExamMode('softSkills')} className={`px-4 py-2 rounded-md text-xs font-bold shadow-sm transition-all border ${settings.examType === 'softSkills' ? 'bg-amber-500 text-white border-amber-600' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-100'}`}>تفعيل السوفت سكيلز</button>
                    <button onClick={()=>setExamMode('closed')} className={`px-4 py-2 rounded-md text-xs font-bold shadow-sm transition-all border ${settings.examType === 'closed' ? 'bg-rose-500 text-white border-rose-600' : 'bg-white text-slate-700 border-slate-300 hover:bg-slate-100'}`}>إغلاق الامتحانات</button>
                    <button onClick={startNewExam} className="bg-slate-800 text-white px-4 py-2 rounded-md text-xs font-bold shadow-sm transition-all border border-slate-900 ml-2">تصفير النتائج</button>
                </div>
            </div>

            {(topQ || topCat) && settings.examType !== 'softSkills' && (
                <div className="bg-gradient-to-r from-raya-50 to-slate-50 p-4 rounded-xl border border-raya-100 shadow-sm flex flex-col md:flex-row gap-4">
                    {topQ && <div className="flex-1 bg-white p-3 rounded-lg border border-slate-200 shadow-sm"><p className="text-[10px] font-bold text-rose-500 mb-1">أكثر سؤال تم الخطأ فيه ({topQ[1]} أخطاء)</p><p className="text-xs font-bold text-slate-800 leading-relaxed">{topQ[0]}</p></div>}
                    {topCat && topCat[0] !== 'عام' && <div className="flex-1 bg-white p-3 rounded-lg border border-slate-200 shadow-sm"><p className="text-[10px] font-bold text-amber-500 mb-1">أكثر فئة/عرض بحاجة لتدريب ({topCat[1]} أخطاء)</p><p className="text-sm font-black text-raya-800">{topCat[0]}</p></div>}
                </div>
            )}
            
            <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col">
                    <h3 className="font-bold text-xs text-slate-800 mb-2">النشرة والعروض</h3>
                    <textarea dir="ltr" className="w-full flex-grow h-32 p-2 border rounded text-[10px] font-mono outline-none mb-2 bg-slate-50" value={offersJSON} onChange={e=>setOffersJSON(e.target.value)}></textarea>
                    <button onClick={()=>saveJSON('offers')} className="bg-raya-600 text-white text-xs font-bold py-2 rounded">حفظ</button>
                </div>
                <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col">
                    <h3 className="font-bold text-xs text-slate-800 mb-2">أسئلة العروض</h3>
                    <textarea dir="ltr" className="w-full flex-grow h-32 p-2 border rounded text-[10px] font-mono outline-none mb-2 bg-slate-50" value={questionsJSON} onChange={e=>setQuestionsJSON(e.target.value)}></textarea>
                    <button onClick={()=>saveJSON('questionsPool')} className="bg-raya-600 text-white text-xs font-bold py-2 rounded">حفظ</button>
                </div>
                <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col">
                    <h3 className="font-bold text-xs text-slate-800 mb-2">مواقف السوفت سكيلز (ومؤشر الأنانية)</h3>
                    <textarea dir="ltr" className="w-full flex-grow h-32 p-2 border rounded text-[10px] font-mono outline-none mb-2 bg-amber-50" value={softSkillsJSON} onChange={e=>setSoftSkillsJSON(e.target.value)}></textarea>
                    <button onClick={()=>saveJSON('softSkillsPool')} className="bg-amber-500 text-white text-xs font-bold py-2 rounded">حفظ</button>
                </div>
            </div>

            {pendingUsers.length > 0 && (
                <div className="bg-amber-50 p-5 rounded-xl border border-amber-200 shadow-sm">
                    <h3 className="text-sm font-bold text-amber-900 mb-3">⏳ طلبات تسجيل ({pendingUsers.length})</h3>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                        {pendingUsers.map(u => (
                            <div key={u.id} className="bg-white p-3 rounded-lg shadow-sm border border-amber-100 flex justify-between items-center">
                                <div><p className="font-bold text-sm text-slate-800">{u.name}</p><p className="text-[10px] font-bold text-raya-600 mt-0.5">{u.brand}</p></div>
                                <div className="flex gap-1">
                                    <button onClick={()=>db.collection('users').doc(u.email).update({status: 'active'})} className="bg-emerald-100 text-emerald-700 px-2 py-1 rounded text-xs font-bold">قبول</button>
                                    <button onClick={()=>db.collection('users').doc(u.email).delete()} className="bg-rose-100 text-rose-700 px-2 py-1 rounded text-xs font-bold">رفض</button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            )}

            <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">

function ExamRoom({ user, onFinish }) {
    const [qs, setQs] = useState([]); const [ans, setAns] = useState({}); const [cd, setCd] = useState(3); const [time, setTime] = useState(300); const [on, setOn] = useState(false); const [isSubmitting, setIsSubmitting] = useState(false);
    const [warningOverlay, setWarningOverlay] = useState(null); 
    const ansRef = useRef({}); const timeRef = useRef(300); const warnings = useRef(0);
    const [maxScore, setMaxScore] = useState(6);
    const [examTypeState, setExamTypeState] = useState('offers');

    useEffect(() => { 
        db.collection('settings').doc('main').get().then(d => { 
            if(d.exists) {
                const data = d.data();
                const isSoftSkills = data.examType === 'softSkills';
                setExamTypeState(isSoftSkills ? 'softSkills' : 'offers');
                
                const pool = isSoftSkills ? data.softSkillsPool : data.questionsPool;
                const reqCount = isSoftSkills ? 4 : 6;
                setMaxScore(reqCount);

                if(pool?.length >= reqCount) {
                    const shuffled = [...pool].sort(()=>0.5-Math.random()).slice(0,reqCount);
                    const processed = shuffled.map(q => {
                        let exactCorrectString = "";
                        if (q.answer !== undefined) { exactCorrectString = String(q.answer).trim(); } 
                        else if (q.correct !== undefined) { 
                            // التوافق مع JSON السوفت سكيلز (Object) أو العروض (String)
                            let cOpt = q.options[Number(q.correct)];
                            exactCorrectString = typeof cOpt === 'object' ? String(cOpt.text).trim() : String(cOpt).trim(); 
                        }

                        const optsWithMeta = q.options.map(opt => {
                            let textVal = typeof opt === 'object' ? String(opt.text).trim() : String(opt).trim();
                            let selfishVal = typeof opt === 'object' && opt.selfishness ? Number(opt.selfishness) : 0;
                            return { text: textVal, selfishness: selfishVal, isCorrect: textVal === exactCorrectString };
                        });
                        optsWithMeta.sort(()=>0.5-Math.random()); 
                        
                        return { q: q.question, opts: optsWithMeta, correctText: exactCorrectString, category: q.category || 'غير محدد' };
                    });
                    setQs(processed);
                } else { alert("نعتذر، الأسئلة بالبنك غير كافية للتقييم."); window.location.reload(); }
            }
        }); 
    }, []);
    
    useEffect(() => { if(qs.length>0&&cd>0) setTimeout(()=>setCd(cd-1),1000); else if(qs.length>0&&cd===0) setOn(true); }, [cd, qs]);
    useEffect(() => { if(on && time>0 && !isSubmitting && !warningOverlay) { const timerId = setTimeout(()=>{ setTime(time-1); timeRef.current = time-1; }, 1000); return () => clearTimeout(timerId); } else if(on && time===0 && !isSubmitting) submit(true); }, [on, time, isSubmitting, warningOverlay]);

    useEffect(() => {
        const handleCheat = () => {
            if(on && !isSubmitting && !warningOverlay) {
                warnings.current += 1;
                if(warnings.current === 1) {
                    setWarningOverlay("⚠️ إنذار أمني\n\nلقد قمت بالخروج من الشاشة أو فقدان التركيز!\nيرجى الضغط على 'موافق' للعودة للاختبار.\nتكرار الخروج سيسحب الورقة تلقائياً.");
                } else if(warnings.current >= 2) {
                    setWarningOverlay("🚫 تم سحب التقييم لمخالفة القواعد الأمنية للمرة الثانية.");
                    setTimeout(() => submit(true), 2000);
                }
            }
        };

        const onVisibilityChange = () => { if(document.hidden) handleCheat(); };
        const onKeyDown = (e) => { if(e.key === 'PrintScreen') { navigator.clipboard.writeText(''); alert('غير مسموح بالتقاط صور.'); } };

        if(on) { document.body.classList.add('exam-protected'); document.addEventListener('visibilitychange', onVisibilityChange); window.addEventListener('keyup', onKeyDown); window.addEventListener('blur', handleCheat); }
        return () => { document.body.classList.remove('exam-protected'); document.removeEventListener('visibilitychange', onVisibilityChange); window.removeEventListener('keyup', onKeyDown); window.removeEventListener('blur', handleCheat); };
    }, [on, isSubmitting, warningOverlay]);
    
    const submit = async(isForced = false) => { 
        if(isSubmitting) return; setIsSubmitting(true);
        try {
            let s=0; let m=[]; let allAns=[]; let totalSelfishness = 0; let answeredQs = 0;
            qs.forEach((q,i) => {
                const selectedOptIndex = ansRef.current[i];
                const selectedOpt = selectedOptIndex !== undefined ? q.opts[selectedOptIndex] : null;
                const uText = selectedOpt ? selectedOpt.text : "لم يُجب";
                const selfishVal = selectedOpt ? selectedOpt.selfishness : 0;
                
                if(selectedOpt) answeredQs++;
                totalSelfishness += selfishVal;

                allAns.push({q: q.q || "غير معروف", userAns: uText, category: q.category, selfishness: selfishVal});

                if(selectedOpt && selectedOpt.isCorrect) s++;
                else m.push({q: q.q || "غير معروف", correctAns: q.correctText || "بدون", userAns: uText, category: q.category});
            }); 
            const finalTime = 300 - timeRef.current;
            const avgSelfishness = answeredQs > 0 ? Math.round(totalSelfishness / answeredQs) : 0;

            const payload = JSON.parse(JSON.stringify({ hasExamined: true, score: s, maxScore: maxScore, timeTaken: finalTime, mistakes: m, allAnswers: allAns, lastExamType: examTypeState, selfishnessScore: avgSelfishness }));
            await db.collection('users').doc(user.email).update(payload); 
            onFinish(s,m,finalTime,maxScore, examTypeState, allAns, avgSelfishness);
        } catch(error) { alert("حدث خطأ: " + error.message); setIsSubmitting(false); }
    };
    
    const handleOptionSelect = (qIndex, optIndex) => {
        if(isSubmitting || warningOverlay) return;
        const newAns = {...ansRef.current, [qIndex]: optIndex}; ansRef.current = newAns; setAns(newAns);
    };

    if(!on) return <div className="flex items-center justify-center h-screen bg-slate-800"><div className="bg-white p-8 rounded-3xl shadow-xl border-4 border-raya-500 text-center w-48 h-48 flex flex-col justify-center items-center"><CompanyLogo className="h-6 mb-2 opacity-50" /><div className="text-raya-500 font-bold mb-1 text-xs">تجهيز التقييم</div><div className="text-5xl text-raya-800 font-black animate-pulse">{cd}</div></div></div>;
    
    return (
        <div className="max-w-2xl mx-auto pb-20 pt-2 px-2 exam-protected fade-in relative">
            {warningOverlay && (
                <div className="fixed inset-0 bg-slate-900/80 z-[100] flex items-center justify-center p-4 backdrop-blur-sm">
                    <div className="bg-white p-5 rounded-xl max-w-xs text-center shadow-2xl animate-[fadeIn_0.2s_ease-out]">
                        <div className="text-3xl mb-2">{warningOverlay.includes('🚫') ? '🚫' : '⚠️'}</div>
                        <p className="font-bold text-slate-800 text-xs whitespace-pre-wrap leading-relaxed">{warningOverlay}</p>
                        {!warningOverlay.includes('🚫') && (
                            <button onClick={()=>setWarningOverlay(null)} className="mt-4 w-full bg-raya-500 text-white font-bold py-2 rounded shadow active:scale-95 text-xs">
                                موافق، متابعة
                            </button>
                        )}
                    </div>
                </div>
            )}

            <div className="bg-white p-3 rounded-lg shadow-sm mb-4 sticky top-2 z-40 border-b-2 border-raya-500 flex justify-between items-center bg-opacity-95 backdrop-blur-md">
                <div className="text-xs font-black text-raya-800 hidden sm:flex items-center gap-1"><span className="w-1.5 h-1.5 rounded-full bg-rose-500 animate-ping"></span> التقييم</div>
                <div className="flex gap-2 w-full sm:w-auto justify-between sm:justify-end items-center">
                    <span className="text-slate-600 text-[10px] bg-slate-100 px-2 py-1 rounded border border-slate-200">الإجابات: <span className="text-raya-700 font-black text-xs">{Object.keys(ans).length}</span>/{maxScore}</span>
                    <span className={`text-sm px-3 py-1 rounded border shadow-sm font-mono font-bold ${time<60?'text-rose-600 bg-rose-50 border-rose-200 animate-pulse':'text-raya-800 bg-raya-50 border-raya-200'}`}>⏱ {Math.floor(time/60)}:{('0'+(time%60)).slice(-2)}</span>
                </div>
            </div>

            <div className="space-y-4">
                {qs.map((q,i)=>(
                    <div key={i} className="bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                        <h3 className="text-sm font-bold mb-3 text-slate-800 flex gap-2 leading-relaxed items-start"><span className="bg-slate-100 text-slate-500 w-6 h-6 flex items-center justify-center rounded shrink-0 text-xs border border-slate-200">{i+1}</span><span className="mt-0.5">{q.q}</span></h3>
                        <div className="space-y-2 pl-1 pr-1">
                            {q.opts.map((optObj,idx)=>(
                                <div key={idx} onClick={()=>handleOptionSelect(i, idx)} className={`flex items-center p-3 rounded-lg border-2 cursor-pointer transition-all ${ans[i]===idx?'bg-raya-50 border-raya-400 shadow-sm':'bg-white border-slate-100 hover:bg-slate-50'}`}>
                                    <div className={`w-3.5 h-3.5 rounded-full border-2 ml-2.5 flex items-center justify-center shrink-0 bg-white transition-colors ${ans[i]===idx?'border-raya-600':'border-slate-300'}`}>{ans[i]===idx&&<div className="w-1.5 h-1.5 bg-raya-600 rounded-full"></div>}</div>
                                    <span className={`text-xs font-bold ${ans[i]===idx?'text-raya-800':'text-slate-600'}`}>{optObj.text}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                ))}
            </div>

            <div className="fixed bottom-0 left-0 right-0 p-3 bg-white border-t border-slate-200 shadow-[0_-10px_20px_-10px_rgba(0,0,0,0.1)] z-30">
                <button disabled={isSubmitting || warningOverlay} onClick={()=>{if(window.confirm("تأكيد: تسليم الإجابات؟"))submit();}} className={`w-full max-w-lg mx-auto flex justify-center items-center gap-2 ${isSubmitting || warningOverlay ? 'bg-slate-400' : 'bg-raya-500 hover:bg-raya-600'} text-white font-bold text-sm py-3 rounded-lg shadow-sm transition-all active:scale-95`}>
                    {isSubmitting ? 'جاري الاعتماد...' : 'تسليم التقييم'}
                </button>
            </div>
        </div>
    );
}

const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
</script>
</body>
</html>
