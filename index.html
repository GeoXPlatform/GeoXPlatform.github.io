<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>RAYA - العروض المتاحة حاليا</title>
<script src="https://cdn.tailwindcss.com"></script>
<!-- تعريف لون شركة راية -->
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          raya: {
            50: '#e6ebf5', 100: '#ccd7eb', 200: '#99b0d6', 300: '#6688c2', 400: '#3361ad',
            500: '#0033A0', /* لون اللوجو الأساسي */
            600: '#002980', 700: '#001f60', 800: '#001440', 900: '#000a20',
          }
        }
      }
    }
  }
</script>
<style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; color: #0f172a; }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    
    @media print { .exam-protected { display: none !important; } }
    .exam-protected { -webkit-touch-callout: none; -webkit-user-select: none; -khtml-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; }
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const firebaseConfig = { apiKey: "AIzaSyAkSD8k1Q4_gSwar3mwfDPVpUPWzHJevNk", authDomain: "geox-platform.firebaseapp.com", databaseURL: "https://geox-platform-default-rtdb.firebaseio.com", projectId: "geox-platform", storageBucket: "geox-platform.firebasestorage.app", messagingSenderId: "691272759644", appId: "1:691272759644:web:297e11465b2fbe83ef6999", measurementId: "G-HVEFX0HGMM" };
if(!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
    firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);
}
const auth = firebase.auth(); const db = firebase.firestore(); const googleProvider = new firebase.auth.GoogleAuthProvider();
googleProvider.setCustomParameters({ prompt: 'select_account' });

const ADMIN_EMAILS = ["abdoo.ashraf353@gmail.com", "yousef74joe74@gmail.com"];
const AVATARS = [ {id:1, src:'avatar1.png'}, {id:2, src:'avatar2.png'}, {id:3, src:'avatar3.png'}, {id:4, src:'avatar4.png'}, {id:5, src:'avatar5.png'} ];

const RenderAvatar = ({ avatarValue, sizeClass="w-12 h-12" }) => {
    const defaultImg = "https://cdn-icons-png.flaticon.com/512/149/149071.png";
    let src = avatarValue || 'avatar1.png';
    if(src.length < 5 && src.match(/[\p{Emoji}]/u)) {
        return <div className={`flex items-center justify-center text-raya-600 ${sizeClass}`}><span style={{fontSize:'150%'}}>{src}</span></div>;
    }
    return <img src={src} alt="User" className={`${sizeClass} object-contain drop-shadow-sm transition-transform`} onError={e=>e.target.src=defaultImg}/>;
};

const CompanyLogo = ({ className }) => (
    <div className="flex items-center justify-center">
        <img src="logo.png" alt="Company Logo" className={className} onError={(e)=>{e.target.style.display='none'; e.target.nextSibling.style.display='block';}} />
        <span className={`font-black text-raya-800 tracking-wider hidden ${className}`}>RAYA</span>
    </div>
);

function App() {
    const [user, setUser] = useState(null); const [dbUser, setDbUser] = useState(null); const [role, setRole] = useState(null); const [brandInput, setBrandInput] = useState(''); const [view, setView] = useState('login'); const [loading, setLoading] = useState(true);
    
    useEffect(() => {
        const timer = setTimeout(() => { if(loading) setLoading(false); }, 8000);
        const unsubscribe = auth.onAuthStateChanged(async (currentUser) => {
            try {
                if(currentUser) {
                    const email = currentUser.email;
                    if(ADMIN_EMAILS.includes(email)) { setRole('admin'); setUser(currentUser); setView('admin'); setLoading(false); return; }
                    
                    const userDoc = await db.collection('users').doc(email).get();
                    if(userDoc.exists) {
                        const data = userDoc.data();
                        setUser(currentUser); setDbUser(data); setRole('user'); setView('dashboard');
                    }
                } else { setUser(null); setRole(null); setView('login'); }
            } catch(error) { console.error(error); setView('login'); } finally { setLoading(false); clearTimeout(timer); }
        });
        return () => { unsubscribe(); clearTimeout(timer); };
    }, []);

    const handleGoogleLogin = async () => {
        try {
            setLoading(true); const result = await auth.signInWithPopup(googleProvider); const email = result.user.email;
            if(ADMIN_EMAILS.includes(email)) { setRole('admin'); setUser(result.user); setView('admin'); setLoading(false); return; }
            
            const userDocRef = db.collection('users').doc(email); const userDoc = await userDocRef.get();
            if(!userDoc.exists) {
                if(!brandInput.trim()) { alert("تنبيه: اكتب اسم البراند أولاً، ثم اضغط تسجيل دخول."); await auth.signOut(); setLoading(false); return; }
                const newData = { name: result.user.displayName || email.split('@')[0], email: email, brand: brandInput.trim(), status: 'active', hasExamined: false, score: 0, timeTaken: 0, avatar: 'avatar1.png', mistakes: [] };
                await userDocRef.set(newData);
                setDbUser(newData); setUser(result.user); setRole('user'); setView('dashboard');
            } else {
                setDbUser(userDoc.data()); setUser(result.user); setRole('user'); setView('dashboard');
            }
        } catch(error) { if(error.code !== 'auth/popup-closed-by-user') alert("خطأ في الاتصال. تأكد من الإنترنت."); } finally { setLoading(false); }
    };

    const handleLogout = async () => { if(window.confirm("هل تريد تسجيل الخروج؟")) { await auth.signOut(); window.location.reload(); } };
    
    if(loading) return <div className="flex flex-col h-screen items-center justify-center bg-slate-50"><div className="w-10 h-10 border-4 border-raya-500 border-t-transparent rounded-full animate-spin mb-3"></div><div className="text-raya-800 font-bold text-sm animate-pulse">جاري تسجيل الدخول...</div></div>;

    return (
        <div className="min-h-screen flex flex-col bg-slate-50">
            {user && (
                <header className="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
                    <div className="max-w-7xl mx-auto px-4 py-2 flex justify-between items-center">
                        <div className="flex gap-2 items-center">
                            <button onClick={handleLogout} className="text-xs font-bold text-slate-600 hover:text-slate-900 bg-slate-100 px-3 py-1.5 rounded transition-colors border border-slate-200">خروج</button>
                            {role === 'user' && dbUser?.mistakes?.length > 0 && <button onClick={() => alert("مراجعة الأخطاء السابقة:\n\n" + dbUser.mistakes.map(m => `السؤال: ${m.q}\nإجابتك: ${m.userAns}\nالصحيح: ${m.correctAns}`).join('\n\n---\n'))} className="text-xs font-bold text-rose-600 bg-rose-50 px-3 py-1.5 rounded transition-colors border border-rose-200 flex items-center gap-1"> بنك أخطائي</button>}
                        </div>
                        <div className="flex items-center gap-3">
                            {role === 'admin' && <span className="bg-raya-100 text-raya-800 text-[10px] font-bold px-2 py-1 rounded border border-raya-200">مدير النظام</span>}
                            <CompanyLogo className="h-6 md:h-8 object-contain" />
                        </div>
                    </div>
                </header>
            )}
            
            <main className="flex-grow p-3 md:p-6">
                {view === 'login' && (
                    <div className="flex flex-col items-center justify-center min-h-[85vh] fade-in">
                        <div className="bg-white p-6 md:p-8 rounded-2xl shadow-lg border border-slate-100 w-full max-w-sm text-center relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-full h-1 bg-raya-500"></div>
                            <CompanyLogo className="h-12 mx-auto mb-4 object-contain" />
                            <p className="text-raya-800 font-bold text-base mb-6">العروض المتاحة حاليا</p>
                            
                            <div className="space-y-4">
                                <div className="text-right">
                                    <label className="block text-xs font-bold text-slate-700 mb-1">اسم البراند</label>
                                    <input type="text" className="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-1 focus:ring-raya-500 focus:border-raya-500 outline-none transition text-sm font-medium text-slate-800" value={brandInput} onChange={e => setBrandInput(e.target.value)} />
                                </div>
                                <button onClick={handleGoogleLogin} className="w-full bg-raya-500 text-white font-bold py-3 rounded-lg shadow hover:bg-raya-600 transition flex items-center justify-center gap-2 active:scale-95 text-sm border border-raya-600">
                                    تسجيل دخول
                                </button>
                            </div>
                            <p className="mt-4 text-[10px] font-semibold text-slate-400 bg-slate-50 p-2 rounded">إذا كنت مسجلاً مسبقاً، اترك خانة البراند فارغة واضغط تسجيل دخول.</p>
                        </div>
                    </div>
                )}
                {view === 'admin' && <AdminPanel />}
                {view === 'dashboard' && role === 'user' && <UserDashboard user={user} dbUser={dbUser} setDbUser={setDbUser} onStartExam={() => setView('exam')} />}
                {view === 'exam' && role === 'user' && <ExamRoom user={user} onFinish={(s,m,t) => { alert(`تم الاعتماد بنجاح!\n\nالنتيجة النهائية: ${s}/6\nالوقت المستغرق: ${t} ثانية`); setDbUser(p=>({...p,hasExamined:true,score:s,mistakes:m,timeTaken:t})); setView('dashboard'); }} />}
            </main>
        </div>
    );
}

function AdminPanel() {
    const [users, setUsers] = useState([]); const [settings, setSettings] = useState({examActive:false,questionsPool:[],offers:[]}); 
    const [search, setSearch] = useState('');
    const [offersJSON, setOffersJSON] = useState('');
    const [questionsJSON, setQuestionsJSON] = useState('');
    const [mistakesModal, setMistakesModal] = useState(null);

    useEffect(() => {
        db.collection('users').onSnapshot(s => setUsers(s.docs.map(d => ({id:d.id,...d.data()}))));
        db.collection('settings').doc('main').onSnapshot(d => {
            if(d.exists) {
                const data = d.data(); setSettings(data);
                if(!offersJSON) setOffersJSON(JSON.stringify(data.offers || [], null, 2));
                if(!questionsJSON) setQuestionsJSON(JSON.stringify(data.questionsPool || [], null, 2));
            } else db.collection('settings').doc('main').set({examActive:false,questionsPool:[],offers:[]});
        });
    }, []);

    const toggleExam = () => db.collection('settings').doc('main').update({examActive:!settings.examActive});
    const startNewExam = async () => {
        if(window.confirm("تأكيد: سيتم تصفير نتيجة الامتحان لجميع الموظفين المقبولين ليتمكنوا من دخول الامتحان الجديد؟")) {
            const batch = db.batch();
            users.forEach(u => {
                if(u.status === 'active') batch.update(db.collection('users').doc(u.id), { hasExamined: false, score: 0, timeTaken: 0, mistakes: [] });
            });
            await batch.commit();
            alert("تم تصفير النتائج بنجاح وتجهيز النظام للعرض الجديد!");
        }
    };

    const saveJSON = async (type) => {
        try {
            const raw = type === 'offers' ? offersJSON : questionsJSON;
            const parsed = JSON.parse(raw);
            if(type === 'questionsPool' && (!Array.isArray(parsed) || parsed.length < 6)) { alert("خطأ: يجب أن يحتوي بنك الأسئلة على 6 أسئلة على الأقل."); return; }
            await db.collection('settings').doc('main').update({ [type]: JSON.parse(JSON.stringify(parsed)) });
            alert("تم الحفظ في قاعدة البيانات بنجاح!");
        } catch(e) { alert("خطأ في صيغة الـ JSON! يرجى مراجعة الأقواس والفواصل."); }
    };

    const exportEx = () => { 
        const formattedData = users.map(u => ({ 'الاسم': u.name, 'البريد الإلكتروني': u.email, 'البراند': u.brand, 'حالة الحساب': u.status === 'active' ? 'مقبول' : 'مرفوض/مراجعة', 'أدى الامتحان': u.hasExamined ? 'نعم' : 'لا', 'الدرجة (من 6)': u.hasExamined ? u.score : '-', 'الوقت (ثواني)': u.hasExamined ? u.timeTaken : '-' }));
        const ws = XLSX.utils.json_to_sheet(formattedData); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "تقرير النتائج"); XLSX.writeFile(wb, "Corporate_Report.xlsx"); 
    };

    const activeUsers = users.filter(u => (u.name.includes(search) || u.brand.includes(search)) && u.status === 'active');
    const pendingUsers = users.filter(u => u.status === 'pending');

    return (
        <div className="max-w-6xl mx-auto space-y-6 fade-in">
            <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4">
                <div className="text-center md:text-right">
                    <h2 className="text-xl font-bold text-raya-800 mb-1">لوحة تحكم الإدارة</h2>
                    <div className="flex items-center justify-center md:justify-start gap-1 text-xs font-bold bg-slate-50 px-2 py-1 rounded border border-slate-100">
                        التقييم: <span className={`flex items-center gap-1 ${settings.examActive?'text-emerald-600':'text-rose-600'}`}>
                            <span className={`w-1.5 h-1.5 rounded-full ${settings.examActive?'bg-emerald-500':'bg-rose-500'}`}></span>
                            {settings.examActive?"متاح":"مغلق"}
                        </span>
                    </div>
                </div>
                <div className="flex gap-2 flex-wrap justify-center">
                    <button onClick={toggleExam} className={`px-4 py-2 rounded-lg text-xs font-bold text-white shadow-sm transition-all border ${settings.examActive ? 'bg-rose-600 border-rose-700' : 'bg-emerald-600 border-emerald-700'}`}>{settings.examActive ? 'إغلاق الامتحان' : 'إتاحة الامتحان'}</button>
                    <button onClick={startNewExam} className="bg-raya-500 text-white px-4 py-2 rounded-lg text-xs font-bold shadow-sm transition-all border border-raya-600">تصفير وإطلاق عرض جديد</button>
                </div>
            </div>
            
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-4">
                <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col">
                    <div className="flex justify-between items-center mb-3">
                        <h3 className="font-bold text-sm text-slate-800">العروض (JSON)</h3>
                        <span className="bg-raya-50 text-raya-700 px-2 py-0.5 rounded text-[10px] font-bold border border-raya-100">{settings.offers?.length||0}</span>
                    </div>
                    <textarea dir="ltr" className="w-full flex-grow h-32 p-3 border border-slate-200 rounded-lg text-left font-mono text-[11px] focus:ring-1 focus:ring-raya-500 outline-none mb-3 bg-slate-50 text-slate-700" value={offersJSON} onChange={e=>setOffersJSON(e.target.value)}></textarea>
                    <button onClick={()=>saveJSON('offers')} className="bg-slate-800 text-white text-xs font-bold py-2 rounded-lg shadow-sm">حفظ العروض</button>
                </div>
                <div className="bg-white p-5 rounded-xl shadow-sm border border-slate-200 flex flex-col">
                    <div className="flex justify-between items-center mb-3">
                        <h3 className="font-bold text-sm text-slate-800">بنك الأسئلة (JSON)</h3>
                        <span className="bg-raya-50 text-raya-700 px-2 py-0.5 rounded text-[10px] font-bold border border-raya-100">{settings.questionsPool?.length||0}</span>
                    </div>
                    <textarea dir="ltr" className="w-full flex-grow h-32 p-3 border border-slate-200 rounded-lg text-left font-mono text-[11px] focus:ring-1 focus:ring-raya-500 outline-none mb-3 bg-slate-50 text-slate-700" value={questionsJSON} onChange={e=>setQuestionsJSON(e.target.value)}></textarea>
                    <button onClick={()=>saveJSON('questionsPool')} className="bg-slate-800 text-white text-xs font-bold py-2 rounded-lg shadow-sm">حفظ الأسئلة</button>
                </div>
            </div>

            {pendingUsers.length > 0 && (
                <div className="bg-amber-50 p-5 rounded-xl border border-amber-200 shadow-sm">
                    <h3 className="text-sm font-bold text-amber-900 mb-3">⏳ طلبات تسجيل ({pendingUsers.length})</h3>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-3">
                        {pendingUsers.map(u => (
                            <div key={u.id} className="bg-white p-3 rounded-lg shadow-sm border border-amber-100 flex justify-between items-center">
                                <div><p className="font-bold text-sm text-slate-800">{u.name}</p><p className="text-[10px] font-bold text-raya-600 mt-0.5">{u.brand}</p></div>
                                <div className="flex gap-1">
                                    <button onClick={()=>db.collection('users').doc(u.email).update({status: 'active'})} className="bg-emerald-100 text-emerald-700 px-2 py-1 rounded text-xs font-bold">قبول</button>
                                    <button onClick={()=>db.collection('users').doc(u.email).delete()} className="bg-rose-100 text-rose-700 px-2 py-1 rounded text-xs font-bold">رفض</button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            )}

            <div className="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div className="p-4 border-b border-slate-100 flex justify-between items-center flex-wrap gap-3 bg-slate-50">
                    <h3 className="text-base font-bold text-raya-800">الموظفين ({activeUsers.length})</h3>
                    <div className="flex gap-2 w-full md:w-auto">
                        <input type="text" placeholder="بحث..." className="flex-grow border border-slate-300 p-1.5 rounded bg-white outline-none focus:border-raya-500 text-xs" onChange={e=>setSearch(e.target.value)} />
                        <button onClick={exportEx} className="bg-emerald-600 text-white px-3 py-1.5 rounded text-xs font-bold">تصدير Excel</button>
                    </div>
                </div>
                <div className="overflow-x-auto p-1">
                    <table className="w-full text-right border-collapse text-xs">
                        <thead className="text-slate-500">
                            <tr><th className="p-2 border-b border-slate-100">الموظف</th><th className="p-2 border-b border-slate-100">البراند</th><th className="p-2 border-b border-slate-100 text-center">الامتحان</th><th className="p-2 border-b border-slate-100 text-center">النتيجة</th><th className="p-2 border-b border-slate-100 text-center">التفاصيل</th><th className="p-2 border-b border-slate-100 text-center">إدارة</th></tr>
                        </thead>
                        <tbody className="divide-y divide-slate-50">
                            {activeUsers.map(u => (
                                <tr key={u.id} className="hover:bg-raya-50/50">
                                    <td className="p-2"><div className="font-bold text-slate-800">{u.name}</div><div className="text-[10px] text-slate-400">{u.email}</div></td>
                                    <td className="p-2"><span className="font-semibold text-slate-700 bg-slate-100 px-2 py-0.5 rounded">{u.brand}</span></td>
                                    <td className="p-2 text-center">{u.hasExamined ? <span className="bg-emerald-50 text-emerald-600 px-2 py-0.5 rounded text-[10px] font-bold">مكتمل</span> : <span className="bg-slate-50 text-slate-500 px-2 py-0.5 rounded text-[10px] font-bold">انتظار</span>}</td>
                                    <td className="p-2 text-center">{u.hasExamined ? <div><span className="font-bold text-raya-800">{u.score}/6</span><div className="text-[10px] text-slate-500">{u.timeTaken}ث</div></div> : '-'}</td>
                                    <td className="p-2 text-center">{u.hasExamined && u.mistakes?.length > 0 ? <button onClick={()=>setMistakesModal(u)} className="bg-rose-50 text-rose-600 border border-rose-100 px-2 py-1 rounded text-[10px] font-bold">الأخطاء ({u.mistakes.length})</button> : (u.hasExamined ? <span className="text-emerald-500 text-[10px] font-bold">كاملة 🏆</span> : '-')}</td>
                                    <td className="p-2 text-center"><button onClick={()=>{if(confirm("حذف الموظف نهائياً؟")) db.collection('users').doc(u.email).delete()}} className="text-slate-400 hover:text-rose-600 p-1 rounded text-[10px] font-bold">حذف</button></td>
                                </tr>
                            ))}
                        </tbody>
                    </table>
                </div>
            </div>

            {mistakesModal && (
                <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-3">
                    <div className="bg-white rounded-xl shadow-xl w-full max-w-lg max-h-[85vh] flex flex-col overflow-hidden animate-[fadeIn_0.2s_ease-out]">
                        <div className="p-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                            <div><h3 className="font-bold text-base text-raya-900">سجل: {mistakesModal.name}</h3><p className="text-[11px] font-bold text-slate-500">{mistakesModal.brand} | النتيجة: {mistakesModal.score}/6</p></div>
                            <button onClick={()=>setMistakesModal(null)} className="w-8 h-8 rounded-full bg-slate-200 text-slate-600 font-bold">&times;</button>
                        </div>
                        <div className="p-4 overflow-y-auto space-y-3 bg-slate-50/50 flex-grow">
                            {mistakesModal.mistakes.map((m, i) => (
                                <div key={i} className="bg-white p-3 rounded-lg border border-slate-200 shadow-sm relative overflow-hidden">
                                    <div className="absolute right-0 top-0 bottom-0 w-1 bg-rose-400"></div>
                                    <p className="font-bold text-slate-800 text-sm mb-2"><span className="text-rose-500 ml-1">{i+1}.</span> {m.q}</p>
                                    <div className="space-y-1.5 bg-slate-50 p-2 rounded text-[11px]">
                                        <p className="flex items-start gap-1"><span className="text-rose-700 font-bold bg-rose-100 px-1 rounded shrink-0">إجابته:</span> <span className="font-semibold text-slate-700">{m.userAns}</span></p>
                                        <p className="flex items-start gap-1"><span className="text-emerald-700 font-bold bg-emerald-100 px-1 rounded shrink-0">الصحيحة:</span> <span className="font-bold text-emerald-700">{m.correctAns}</span></p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}

function UserDashboard({ user, dbUser, setDbUser, onStartExam }) {
    const [settings, setSettings] = useState({examActive:false,offers:[]}); const [board, setBoard] = useState([]);

        db.collection('users').where('hasExamined','==',true).onSnapshot(s => {
            const sortedData = s.docs.map(d=>d.data()).sort((a,b)=> b.score - a.score || a.timeTaken - b.timeTaken);
            setBoard(sortedData);
        });
    }, []);
    const rank = board.findIndex(u => u.email === user.email) + 1;
    return (
        <div className="max-w-4xl mx-auto space-y-5 fade-in">
            <div className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex flex-col sm:flex-row items-center justify-between gap-5 relative overflow-hidden">
                <div className="text-center sm:text-right flex-grow z-10">
                    <h2 className="text-xl md:text-2xl font-black text-raya-800 mb-1">مرحباً بك، {dbUser.name}</h2>
                    <span className="inline-flex items-center gap-1 bg-slate-50 text-slate-700 border border-slate-200 px-3 py-1 rounded-lg text-[11px] font-bold">البراند: <span className="text-raya-600">{dbUser.brand}</span></span>
                </div>
                <div className="text-center bg-slate-50 p-3 rounded-xl border border-slate-100 shrink-0 z-10 w-full sm:w-auto">
                    <p className="text-[10px] font-bold text-slate-400 mb-2">صورة الملف الشخصي</p>
                    <div className="flex justify-center mb-3">
                        <RenderAvatar avatarValue={dbUser.avatar} sizeClass="w-16 h-16 md:w-20 md:h-20" />
                    </div>
                    <div className="flex gap-2 justify-center bg-white p-2 rounded-lg border border-slate-100">
                        {AVATARS.map(a=>(
                            <div key={a.id} onClick={()=>{setDbUser({...dbUser,avatar:a.src}); db.collection('users').doc(user.email).update({avatar:a.src});}} className={`cursor-pointer rounded-lg p-1 transition-all flex items-center justify-center ${dbUser.avatar===a.src ? 'bg-raya-50 ring-1 ring-raya-400 scale-110 shadow-sm' : 'hover:bg-slate-50 opacity-60 hover:opacity-100'}`}>
                                <RenderAvatar avatarValue={a.src} sizeClass="w-8 h-8" />
                            </div>
                        ))}
                    </div>
                </div>
            </div>
            
            <div className="bg-white p-5 md:p-8 rounded-2xl shadow-sm border border-slate-200 border-t-4 border-t-raya-500 text-center relative overflow-hidden">
                <h2 className="text-lg md:text-xl font-bold mb-5 text-slate-800 flex items-center justify-center gap-2"><span className="text-raya-500">📋</span> العروض والتحديثات المتاحة</h2>
                <div className="grid gap-3 mb-6 text-right">
                    {settings.offers?.length>0 ? settings.offers.map((o,i)=>(
                        <div key={i} className="bg-slate-50 border border-slate-200 p-4 rounded-xl shadow-sm relative overflow-hidden">
                            <div className="absolute right-0 top-0 bottom-0 w-1 bg-raya-400"></div>
                            {o.image && <img src={o.image} alt="عرض" className="w-full max-h-48 object-contain rounded-lg mb-3 bg-white border border-slate-100 p-1" />}
                            {o.text && <p className="font-semibold text-slate-800 text-sm leading-relaxed flex items-start gap-2"><span className="text-raya-500 text-lg shrink-0">📌</span> <span>{o.text}</span></p>}
                        </div>
                    )) : <div className="bg-slate-50 p-6 rounded-xl border border-dashed border-slate-300 text-slate-400 font-bold text-sm">لا توجد عروض أو تحديثات حالياً.</div>}
                </div>
                
                {dbUser.hasExamined ? (
                    <div className="p-4 bg-emerald-50 text-emerald-700 rounded-xl font-bold text-sm border border-emerald-200 shadow-inner flex items-center justify-center gap-2">✅ تمت المشاركة في التقييم الخاص بنجاح.</div>
                ) : (
                    <div className="space-y-3">
                        <p className="text-[11px] font-bold text-slate-400">تأكد من قراءة العروض جيداً قبل التقييم.</p>
                        <button onClick={onStartExam} disabled={!settings.examActive} className={`w-full md:w-1/2 py-3 rounded-xl font-bold text-base text-white shadow-md transition-all ${settings.examActive ? 'bg-raya-500 hover:bg-raya-600 active:scale-95' : 'bg-slate-300 cursor-not-allowed text-slate-500'}`}>
                            {settings.examActive ? 'بدء التقييم الآن' : '🔒 التقييم مغلق حالياً'}
                        </button>
                    </div>
                )}
            </div>

            <div className="bg-white p-5 md:p-8 rounded-2xl shadow-sm border border-slate-200">
                <h2 className="text-xl font-black text-center text-slate-800 mb-6">🏆 أوائل التقييم</h2>
                
                {dbUser.hasExamined && rank > 0 && (
                    <div className="text-center font-bold mb-6 text-raya-800 bg-raya-50 py-3 rounded-lg border border-raya-200 text-sm">
                        ترتيبك الحالي: المركز {rank}
                    </div>
                )}
                
                <div className="space-y-3">
                    {board.length===0 && <p className="text-center text-slate-400 font-bold text-xs py-6 bg-slate-50 rounded-xl border border-dashed border-slate-200">لم يتم اعتماد أي نتائج.</p>}
                    {board.map((u,i) => {
                        const isFirst = i===0; const isSecond = i===1; const isThird = i===2;
                        const cardClass = isFirst ? 'bg-gradient-to-r from-amber-50 to-yellow-100 border-amber-200 text-amber-900 shadow-sm' : 
                                          isSecond ? 'bg-slate-50 border-slate-200 text-slate-800' : 
                                          isThird ? 'bg-orange-50 border-orange-100 text-orange-900' : 'bg-white border-slate-100 text-slate-600';
                        return (
                            <div key={i} className={`flex justify-between items-center p-3 rounded-xl font-bold border ${cardClass}`}>
                                <div className="flex items-center gap-3">
                                    <div className="w-8 text-xl text-center">{isFirst?'🥇':isSecond?'🥈':isThird?'🥉':<span className="text-sm text-slate-400">#{i+1}</span>}</div>
                                    <RenderAvatar avatarValue={u.avatar} sizeClass="w-10 h-10" />
                                    <div>
                                        <div className={`font-black ${isFirst ? 'text-sm' : 'text-xs'}`}>{u.name}</div>
                                        <div className={`text-[9px] font-bold px-2 py-0.5 rounded inline-block mt-0.5 ${isFirst?'bg-amber-200/50':isSecond?'bg-slate-200/50':isThird?'bg-orange-200/50':'bg-slate-100'}`}>{u.brand}</div>
                                    </div>
                                </div>
                                <div className="bg-white/80 px-3 py-1.5 rounded-lg text-center border border-white/60 shadow-sm">
                                    <div className="text-raya-700 text-base font-black">{u.score}/6</div>

}

function ExamRoom({ user, onFinish }) {
    const [qs, setQs] = useState([]); const [ans, setAns] = useState({}); const [cd, setCd] = useState(3); const [time, setTime] = useState(300); const [on, setOn] = useState(false); const [isSubmitting, setIsSubmitting] = useState(false);
    const [warningOverlay, setWarningOverlay] = useState(null); // نافذة التحذير المنبثقة بدلاً من alert
    const ansRef = useRef({}); const timeRef = useRef(300); const warnings = useRef(0);

    // الحل الجذري الأكيد 100% لمشكلة الـ JSON
    // يتم تحويل الاختيارات لمصفوفة من الـ Objects تحمل قيمة منطقية (isCorrect) قبل خلطها
    useEffect(() => { 
        db.collection('settings').doc('main').get().then(d => { 
            if(d.exists && d.data().questionsPool?.length >= 6) {
                const pool = d.data().questionsPool;
                const shuffled = [...pool].sort(()=>0.5-Math.random()).slice(0,6);
                
                const processed = shuffled.map(q => {
                    // تحديد نص الإجابة الصحيحة الأصلية
                    let exactCorrectString = "";
                    if (q.answer !== undefined) { exactCorrectString = String(q.answer).trim(); } 
                    else if (q.correct !== undefined) { exactCorrectString = String(q.options[Number(q.correct)]).trim(); }

                    // تجهيز الخيارات وإعطاء علامة (True) للإجابة المطابقة
                    const optsWithMeta = q.options.map(opt => ({
                        text: String(opt).trim(),
                        isCorrect: String(opt).trim() === exactCorrectString
                    }));
                    
                    // خلط الخيارات
                    optsWithMeta.sort(()=>0.5-Math.random()); 
                    
                    return { q: q.question, opts: optsWithMeta, correctText: exactCorrectString };
                });
                setQs(processed);
            } else { alert("نعتذر، لا توجد أسئلة كافية."); window.location.reload(); } 
        }); 
    }, []);
    
    useEffect(() => { if(qs.length>0&&cd>0) setTimeout(()=>setCd(cd-1),1000); else if(qs.length>0&&cd===0) setOn(true); }, [cd, qs]);
    
    useEffect(() => { 
        if(on && time>0 && !isSubmitting && !warningOverlay) { const timerId = setTimeout(()=>{ setTime(time-1); timeRef.current = time-1; }, 1000); return () => clearTimeout(timerId); } 
        else if(on && time===0 && !isSubmitting) submit(true); 
    }, [on, time, isSubmitting, warningOverlay]);

    useEffect(() => {
        const handleCheat = () => {
            if(on && !isSubmitting && !warningOverlay) {
                warnings.current += 1;
                if(warnings.current === 1) {
                    setWarningOverlay("⚠️ إنذار أمني (1/2)\n\nلقد قمت بالخروج من شاشة التقييم! يمنع فتح نوافذ أخرى أو ترك الشاشة.\n\nاضغط 'موافق' للعودة للامتحان. إذا تكرر هذا الأمر سيتم سحب الورقة تلقائياً.");
                } else if(warnings.current >= 2) {
                    setWarningOverlay("🚫 تم سحب ورقة التقييم واعتمادها تلقائياً لمخالفة القواعد الأمنية للمرة الثانية.");
                    setTimeout(() => submit(true), 2000);
                }
            }
        };

        const onVisibilityChange = () => { if(document.hidden) handleCheat(); };
        const onKeyDown = (e) => { if(e.key === 'PrintScreen') { navigator.clipboard.writeText(''); alert('حماية النظام: يمنع التقاط صور.'); } };

        if(on) {
            document.body.classList.add('exam-protected');
            document.addEventListener('visibilitychange', onVisibilityChange);
            window.addEventListener('keyup', onKeyDown);
        }

        return () => {
            document.body.classList.remove('exam-protected');
            document.removeEventListener('visibilitychange', onVisibilityChange);
            window.removeEventListener('keyup', onKeyDown);
        };
    }, [on, isSubmitting, warningOverlay]);
    
    const submit = async(isForced = false) => { 
        if(isSubmitting) return; setIsSubmitting(true);
        try {
            let s=0; let m=[]; 
            qs.forEach((q,i) => {
                const selectedOptIndex = ansRef.current[i];
                const selectedOpt = selectedOptIndex !== undefined ? q.opts[selectedOptIndex] : null;
                
                // التقييم يعتمد على (isCorrect) المحفوظة مع الاختيار نفسه!
                if(selectedOpt && selectedOpt.isCorrect) {
                    s++;
                } else {
                    let qText = q.q ? String(q.q) : "سؤال غير معروف";
                    let cText = q.correctText || "بدون إجابة صحيحة";
                    let uText = selectedOpt ? selectedOpt.text : "لم يُجب";
                    m.push({q: qText, correctAns: cText, userAns: uText});
                }
            }); 
            const finalTime = 300 - timeRef.current;
            const payload = JSON.parse(JSON.stringify({ hasExamined: true, score: s, timeTaken: finalTime, mistakes: m }));
            await db.collection('users').doc(user.email).update(payload); 
            onFinish(s,m,finalTime);
        } catch(error) { alert("حدث خطأ أثناء الاعتماد: " + error.message); setIsSubmitting(false); }
    };
    
    const handleOptionSelect = (qIndex, optIndex) => {
        if(isSubmitting || warningOverlay) return;
        const newAns = {...ansRef.current, [qIndex]: optIndex};
        ansRef.current = newAns; setAns(newAns);
    };

    if(!on) return <div className="flex items-center justify-center h-screen bg-slate-800"><div className="bg-white p-8 rounded-3xl shadow-2xl border-4 border-raya-500 text-center w-56 h-56 flex flex-col justify-center items-center"><CompanyLogo className="h-8 mb-3 opacity-50" /><div className="text-raya-500 font-bold mb-1 text-sm">تجهيز التقييم</div><div className="text-6xl text-raya-800 font-black animate-pulse">{cd}</div></div></div>;
    
    return (
        <div className="max-w-2xl mx-auto pb-24 pt-3 px-3 exam-protected fade-in relative">
            {warningOverlay && (
                <div className="fixed inset-0 bg-slate-900/80 z-[100] flex items-center justify-center p-5 backdrop-blur-sm">
                    <div className="bg-white p-6 rounded-2xl max-w-sm text-center shadow-2xl animate-[fadeIn_0.2s_ease-out]">
                        <div className="text-4xl mb-3">{warningOverlay.includes('🚫') ? '🚫' : '⚠️'}</div>
                        <p className="font-bold text-slate-800 text-sm whitespace-pre-wrap leading-relaxed">{warningOverlay}</p>
                        {!warningOverlay.includes('🚫') && (
                            <button onClick={()=>setWarningOverlay(null)} className="mt-5 w-full bg-raya-500 text-white font-bold py-3 rounded-lg shadow active:scale-95 text-sm">
                                موافق، متابعة التقييم
                            </button>
                        )}
                    </div>
                </div>
            )}

            <div className="bg-white p-3 md:p-4 rounded-xl shadow-sm mb-5 sticky top-2 z-40 border-b-2 border-raya-500 flex justify-between items-center bg-opacity-95 backdrop-blur-md">
                <div className="text-sm font-black text-raya-800 hidden sm:flex items-center gap-2"><span className="w-2 h-2 rounded-full bg-rose-500 animate-ping"></span> تقييم المنصة</div>
                <div className="flex gap-3 w-full sm:w-auto justify-between sm:justify-end items-center">
                    <span className="text-slate-600 text-xs bg-slate-100 px-3 py-1.5 rounded-lg border border-slate-200">مكتمل: <span className="text-raya-700 font-black text-sm">{Object.keys(ans).length}</span>/6</span>
                    <span className={`text-base px-4 py-1.5 rounded-lg border shadow-sm font-mono font-bold ${time<60?'text-rose-600 bg-rose-50 border-rose-200 animate-pulse':'text-raya-800 bg-raya-50 border-raya-200'}`}>⏱ {Math.floor(time/60)}:{('0'+(time%60)).slice(-2)}</span>
                </div>
            </div>

            <div className="space-y-5">
                {qs.map((q,i)=>(
                    <div key={i} className="bg-white p-4 md:p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h3 className="text-sm md:text-base font-bold mb-4 text-slate-800 flex gap-3 leading-relaxed items-start"><span className="bg-slate-100 text-slate-500 w-8 h-8 flex items-center justify-center rounded-lg shrink-0 text-sm border border-slate-200">{i+1}</span><span className="mt-1">{q.q}</span></h3>
                        <div className="space-y-3 pl-1 md:pl-8">
                            {q.opts.map((optObj,idx)=>(
                                <div key={idx} onClick={()=>handleOptionSelect(i, idx)} className={`flex items-center p-3 md:p-4 rounded-xl border-2 cursor-pointer transition-all ${ans[i]===idx?'bg-raya-50 border-raya-400 shadow-sm':'bg-white border-slate-200 hover:bg-slate-50'}`}>
                                    <div className={`w-4 h-4 md:w-5 md:h-5 rounded-full border-2 ml-3 flex items-center justify-center shrink-0 bg-white transition-colors ${ans[i]===idx?'border-raya-600':'border-slate-300'}`}>{ans[i]===idx&&<div className="w-2 h-2 bg-raya-600 rounded-full"></div>}</div>
                                    <span className={`text-xs md:text-sm font-bold ${ans[i]===idx?'text-raya-800':'text-slate-600'}`}>{optObj.text}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                ))}
            </div>

            <div className="fixed bottom-0 left-0 right-0 p-4 bg-white border-t border-slate-200 shadow-[0_-10px_20px_-10px_rgba(0,0,0,0.1)] z-30">
                <button disabled={isSubmitting || warningOverlay} onClick={()=>{if(window.confirm("تأكيد: اعتماد التقييم؟"))submit();}} className={`w-full max-w-2xl mx-auto flex justify-center items-center gap-2 ${isSubmitting || warningOverlay ? 'bg-slate-400' : 'bg-raya-500 hover:bg-raya-600'} text-white font-bold text-sm md:text-base py-3 md:py-4 rounded-xl shadow-md transition-all active:scale-95`}>
                    {isSubmitting ? 'جاري الاعتماد...' : 'تسليم التقييم النهائي'}
                </button>
            </div>
        </div>
    );
}

const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
</script>
