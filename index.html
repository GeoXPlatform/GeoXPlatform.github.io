<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>GEOX - منصة العروض والامتحانات</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{user-select:none;-webkit-user-select:none;-moz-user-select:none;-ms-user-select:none;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background-color:#f8fafc;}.avatar-option{cursor:pointer;transition:transform 0.2s;}.avatar-option:hover{transform:scale(1.1);}.selected-avatar{border:4px solid #3b82f6;border-radius:50%;background-color:#eff6ff;}::-webkit-scrollbar{width:8px;}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px;}::-webkit-scrollbar-thumb:hover{background:#94a3b8;}</style>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;
const firebaseConfig = { apiKey: "AIzaSyAkSD8k1Q4_gSwar3mwfDPVpUPWzHJevNk", authDomain: "geox-platform.firebaseapp.com", databaseURL: "https://geox-platform-default-rtdb.firebaseio.com", projectId: "geox-platform", storageBucket: "geox-platform.firebasestorage.app", messagingSenderId: "691272759644", appId: "1:691272759644:web:297e11465b2fbe83ef6999", measurementId: "G-HVEFX0HGMM" };
if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth(); const db = firebase.firestore(); const googleProvider = new firebase.auth.GoogleAuthProvider();
googleProvider.setCustomParameters({ prompt: 'select_account' });
const ADMIN_EMAIL = "abdoo.ashraf353@gmail.com";
const AVATARS = [{id:1,icon:'🧽'},{id:2,icon:'🦑'},{id:3,icon:'⭐'},{id:4,icon:'💼'},{id:5,icon:'🤡'}];

function App() {
    const [user, setUser] = useState(null); const [dbUser, setDbUser] = useState(null); const [role, setRole] = useState(null); const [brandInput, setBrandInput] = useState(''); const [view, setView] = useState('login'); const [loading, setLoading] = useState(true);
    useEffect(() => {
        const timer = setTimeout(() => setLoading(false), 5000);
        const unsubscribe = auth.onAuthStateChanged(async (currentUser) => {
            clearTimeout(timer);
            try {
                if(currentUser) {
                    const email = currentUser.email;
                    if(email === ADMIN_EMAIL) { setRole('admin'); setUser(currentUser); setView('admin'); setLoading(false); return; }
                    const userDoc = await db.collection('users').doc(email).get();
                    if(userDoc.exists) {
                        const data = userDoc.data();
                        if(data.status === 'pending') { alert("حسابك موقوف مؤقتاً."); await auth.signOut(); setUser(null); setView('login'); }
                        else { setUser(currentUser); setDbUser(data); setRole('user'); setView('dashboard'); }
                    }
                } else { setUser(null); setRole(null); setView('login'); }
            } catch(error) { alert("Error: " + error.message); setView('login'); } finally { setLoading(false); }
        });
        return () => { unsubscribe(); clearTimeout(timer); };
    }, []);

    const handleGoogleLogin = async () => {
        try {
            setLoading(true); const result = await auth.signInWithPopup(googleProvider); const email = result.user.email;
            if(email === ADMIN_EMAIL) return; 
            const userDocRef = db.collection('users').doc(email); const userDoc = await userDocRef.get();
            if(!userDoc.exists) {
                if(!brandInput.trim()) { alert("تنبيه: اكتب اسم البراند أولاً قبل الدخول."); await auth.signOut(); setLoading(false); return; }
                const newData = { name: result.user.displayName || email.split('@')[0], email: email, brand: brandInput.trim(), status: 'active', hasExamined: false, score: 0, timeTaken: 0, avatar: '🧽', mistakes: [] };
                await userDocRef.set(newData);
                setDbUser(newData); setUser(result.user); setRole('user'); setView('dashboard');
            }
        } catch(error) { if(error.code !== 'auth/popup-closed-by-user') alert("Error: " + error.message); } finally { setLoading(false); }
    };

    const handleLogout = async () => { if(confirm("تسجيل الخروج؟")) { await auth.signOut(); window.location.reload(); } };
    if(loading) return <div className="flex h-screen items-center justify-center bg-gray-50"><div className="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div></div>;

    return (
        <div className="min-h-screen flex flex-col bg-gray-50">
            {user && (
                <div className="bg-white shadow p-4 flex justify-between items-center sticky top-0 z-50">
                    <div className="flex gap-3">
                        <button onClick={handleLogout} className="bg-gray-100 px-4 py-2 rounded-lg font-bold hover:bg-gray-200">خروج</button>
                        {role === 'user' && dbUser?.mistakes?.length > 0 && <button onClick={() => alert("أخطاؤك:\n\n" + dbUser.mistakes.map(m => `السؤال: ${m.q}\nإجابتك: ${m.userAns}\nالصحيح: ${m.correctAns}`).join('\n\n'))} className="bg-red-50 text-red-600 px-3 py-2 rounded-lg font-bold">❌ أخطائي</button>}
                    </div>
                    <h1 className="text-3xl font-extrabold text-blue-800">GEOX {role==='admin'&&<span className="text-xs bg-blue-100 px-2 rounded">الإدارة</span>}</h1>
                </div>
            )}
            <main className="flex-grow p-4">
                {view === 'login' && (
                    <div className="flex flex-col items-center justify-center min-h-[85vh]">
                        <div className="bg-white p-10 rounded-2xl shadow-xl w-full max-w-md text-center border-t-8 border-blue-600">
                            <h1 className="text-5xl font-extrabold text-blue-800 mb-8">GEOX</h1>
                            <input type="text" placeholder="اكتب البراند هنا (لأول مرة فقط)" className="w-full p-4 mb-4 bg-gray-50 border rounded-xl text-right font-bold" value={brandInput} onChange={e => setBrandInput(e.target.value)} />
                            <button onClick={handleGoogleLogin} className="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-md hover:bg-blue-700">دخول بواسطة Google</button>
                        </div>
                    </div>
                )}
                {view === 'admin' && <AdminPanel />}
                {view === 'dashboard' && role === 'user' && <UserDashboard user={user} dbUser={dbUser} setDbUser={setDbUser} onStartExam={() => setView('exam')} />}
                {view === 'exam' && role === 'user' && <ExamRoom user={user} onFinish={(s,m,t) => { alert(`النتيجة: ${s}/6\nالوقت: ${t}ث`); setDbUser(p=>({...p,hasExamined:true,score:s,mistakes:m,timeTaken:t})); setView('dashboard'); }} />}
            </main>
        </div>
    );
}

function AdminPanel() {
    const [users, setUsers] = useState([]); const [settings, setSettings] = useState({examActive:false,questionsPool:[],offers:[]}); const [search, setSearch] = useState('');
    useEffect(() => {
        db.collection('users').onSnapshot(s => setUsers(s.docs.map(d => ({id:d.id,...d.data()}))));
        db.collection('settings').doc('main').onSnapshot(d => d.exists ? setSettings(d.data()) : db.collection('settings').doc('main').set({examActive:false,questionsPool:[],offers:[]}));
    }, []);
    const handleFile = (e, type) => { const r = new FileReader(); r.onload = async ev => { try{ await db.collection('settings').doc('main').update({[type]:JSON.parse(ev.target.result)}); alert("تم الرفع!"); e.target.value=null; }catch(err){alert("خطأ بالملف");} }; if(e.target.files[0]) r.readAsText(e.target.files[0]); };
    const exportEx = () => { XLSX.writeFile(XLSX.utils.book_append_sheet(XLSX.utils.book_new(), XLSX.utils.json_to_sheet(users.map(u=>({'الاسم':u.name,'البريد':u.email,'البراند':u.brand,'امتحن':u.hasExamined?'نعم':'لا','الدرجة':u.score||0,'الوقت':u.timeTaken||0}))), "Data"), "GEOX.xlsx"); };
    return (
        <div className="max-w-7xl mx-auto space-y-6">
            <div className="bg-white p-6 rounded-xl shadow flex flex-wrap justify-between items-center gap-4">
                <h2 className="text-2xl font-bold">الإدارة <span className={`text-sm px-2 ${settings.examActive?'text-green-600':'text-red-600'}`}>{settings.examActive?"مفعل":"معطل"}</span></h2>
                <div className="flex gap-2">
                    <button onClick={()=>db.collection('settings').doc('main').update({examActive:!settings.examActive})} className="bg-blue-600 text-white px-4 py-2 rounded">تبديل الامتحان</button>
                    <button onClick={async()=>{if(confirm("تصفير؟")){const b=db.batch();users.forEach(u=>b.update(db.collection('users').doc(u.id),{hasExamined:false,score:0,timeTaken:0,mistakes:[]}));await b.commit();alert("تم!");}}} className="bg-red-500 text-white px-4 py-2 rounded">تصفير النتائج</button>
                </div>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div className="bg-white p-6 rounded-xl shadow"><h3 className="font-bold mb-2">رفع العروض (JSON) - {settings.offers?.length||0}</h3><input type="file" accept=".json" onChange={e=>handleFile(e,'offers')} className="w-full border p-2 rounded" /></div>
                <div className="bg-white p-6 rounded-xl shadow"><h3 className="font-bold mb-2">رفع الأسئلة (JSON) - {settings.questionsPool?.length||0}</h3><input type="file" accept=".json" onChange={e=>handleFile(e,'questionsPool')} className="w-full border p-2 rounded" /></div>
            </div>
            <div className="bg-white p-6 rounded-xl shadow overflow-x-auto">
                <div className="flex justify-between mb-4 gap-2"><input type="text" placeholder="بحث..." className="border p-2 rounded" onChange={e=>setSearch(e.target.value)} /><button onClick={exportEx} className="bg-green-600 text-white px-4 py-2 rounded">تصدير</button></div>
                <table className="w-full text-right"><thead className="bg-gray-50"><tr><th className="p-2">الاسم</th><th className="p-2">البراند</th><th className="p-2">النتيجة</th><th className="p-2">إجراء</th></tr></thead><tbody>{users.filter(u=>u.name.includes(search)||u.brand.includes(search)).map(u=><tr key={u.id} className="border-t"><td className="p-2 font-bold">{u.name}</td><td className="p-2">{u.brand}</td><td className="p-2 text-blue-600">{u.hasExamined?`${u.score}/6 - ${u.timeTaken}ث`:''}</td><td className="p-2"><button onClick={()=>db.collection('users').doc(u.email).delete()} className="text-red-500 bg-red-50 px-2 rounded">حذف</button></td></tr>)}</tbody></table>
            </div>
        </div>
    );
}

function UserDashboard({ user, dbUser, setDbUser, onStartExam }) {
    const [settings, setSettings] = useState({examActive:false,offers:[]}); const [board, setBoard] = useState([]);
    useEffect(() => {
        db.collection('settings').doc('main').onSnapshot(d => d.exists && setSettings(d.data()));
        db.collection('users').where('hasExamined','==',true).onSnapshot(s => setBoard(s.docs.map(d=>d.data()).sort((a,b)=>b.score-a.score||a.timeTaken-b.timeTaken)));
    }, []);
    const rank = board.findIndex(u => u.email === user.email) + 1;
    return (
        <div className="max-w-4xl mx-auto space-y-6">
            <div className="bg-white p-6 rounded-2xl shadow text-center flex flex-col md:flex-row items-center justify-between gap-4">
                <div><h2 className="text-2xl font-bold">مرحباً {dbUser.name}</h2><p className="text-blue-600 font-bold bg-blue-50 px-4 py-1 rounded-full mt-2 border">براند: {dbUser.brand}</p></div>
                <div><div className="text-5xl bg-gray-50 p-2 rounded-full border mb-2 inline-block">{dbUser.avatar}</div><div className="flex gap-2 text-2xl">{AVATARS.map(a=><div key={a.id} onClick={()=>{setDbUser({...dbUser,avatar:a.icon});db.collection('users').doc(user.email).update({avatar:a.icon});}} className={`p-1 cursor-pointer rounded ${dbUser.avatar===a.icon?'bg-blue-100 border-2':''}`}>{a.icon}</div>)}</div></div>
            </div>
            <div className="bg-white p-6 rounded-2xl shadow text-center">
                <h2 className="text-2xl font-bold mb-4">📢 العروض الحالية</h2>
                <div className="bg-blue-50 p-4 rounded-xl mb-4 text-right min-h-[100px]">{settings.offers?.length>0 ? settings.offers.map((o,i)=><p key={i} className="font-bold mb-2">📌 {o.title||o.text||JSON.stringify(o)}</p>) : "لا توجد عروض"}</div>
                {dbUser.hasExamined ? <div className="p-4 bg-green-50 text-green-700 rounded-xl font-bold">✅ تم الامتحان!</div> : <button onClick={onStartExam} disabled={!settings.examActive} className={`w-full py-4 rounded-xl font-bold text-white ${settings.examActive?'bg-blue-600':'bg-gray-400'}`}>{settings.examActive?'ابدأ الامتحان':'الامتحان مغلق'}</button>}
            </div>
            <div className="bg-white p-6 rounded-2xl shadow"><h2 className="text-2xl font-bold text-center text-yellow-800 mb-4">🏆 لوحة الشرف</h2>{dbUser.hasExamined&&rank>0&&<div className="text-center font-bold mb-4 text-blue-700">ترتيبك: {rank}</div>}<div className="space-y-2">{board.map((u,i)=><div key={i} className={`flex justify-between p-3 rounded font-bold border ${i===0?'bg-yellow-50':i===1?'bg-gray-100':i===2?'bg-orange-50':'bg-white'}`}><div className="flex items-center gap-3"><span className="w-4">{i+1}</span><span className="text-2xl">{u.avatar}</span>{u.name} <span className="text-xs text-gray-500">({u.brand})</span></div><div className="text-blue-700">{u.score}/6 <span className="text-xs text-gray-500">⏱{u.timeTaken}ث</span></div></div>)}</div></div>
        </div>
    );
}

function ExamRoom({ user, onFinish }) {
    const [qs, setQs] = useState([]); const [ans, setAns] = useState({}); const [cd, setCd] = useState(3); const [time, setTime] = useState(300); const [on, setOn] = useState(false);
    useEffect(() => { db.collection('settings').doc('main').get().then(d => { if(d.exists&&d.data().questionsPool?.length>=6) setQs([...d.data().questionsPool].sort(()=>0.5-Math.random()).slice(0,6).map(q=>{const opts=q.options.map((t,i)=>({t,i})).sort(()=>0.5-Math.random()); return{q:q.question,opts:opts.map(o=>o.t),cor:opts.findIndex(o=>o.i===q.correct)};})); else{alert("لا توجد أسئلة");window.location.reload();} }); }, []);
    useEffect(() => { if(qs.length>0&&cd>0) setTimeout(()=>setCd(cd-1),1000); else if(qs.length>0&&cd===0) setOn(true); }, [cd, qs]);
    useEffect(() => { if(on&&time>0) setTimeout(()=>setTime(time-1),1000); else if(on&&time===0) submit(); }, [on, time]);
    useEffect(() => { const ch = ()=>{if(document.hidden&&on){alert("تسليم بصفر للغش!");force();}}; document.addEventListener('visibilitychange',ch); return ()=>document.removeEventListener('visibilitychange',ch); }, [on]);
    const force = async()=>{ await db.collection('users').doc(user.email).update({hasExamined:true,score:0,timeTaken:300-time,mistakes:[]}); onFinish(0,[],300-time); };
    const submit = async()=>{ let s=0;let m=[]; qs.forEach((q,i)=>{if(ans[i]===q.cor)s++;else m.push({q:q.q,correctAns:q.opts[q.cor],userAns:ans[i]!==undefined?q.opts[ans[i]]:"فارغ"});}); await db.collection('users').doc(user.email).update({hasExamined:true,score:s,timeTaken:300-time,mistakes:m}); onFinish(s,m,300-time); };
    if(!on) return <div className="flex items-center justify-center h-screen"><div className="text-8xl text-blue-600 font-bold animate-bounce">{cd}</div></div>;
    return (
        <div className="max-w-3xl mx-auto pb-24">
            <div className="bg-white p-4 rounded shadow mb-4 sticky top-0 flex justify-between font-bold z-50"><div className="text-blue-800">امتحان GEOX</div><div className={`${time<60?'text-red-600 animate-pulse':'text-blue-700'}`}>⏱ {Math.floor(time/60)}:{('0'+(time%60)).slice(-2)}</div></div>
            <div className="space-y-6">{qs.map((q,i)=><div key={i} className="bg-white p-6 rounded shadow"><h3 className="font-bold mb-4">{i+1}. {q.q}</h3><div className="space-y-2">{q.opts.map((o,idx)=><div key={idx} onClick={()=>setAns({...ans,[i]:idx})} className={`p-3 rounded border cursor-pointer ${ans[i]===idx?'bg-blue-50 border-blue-500':'bg-gray-50'}`}>{o}</div>)}</div></div>)}</div>
            <div className="fixed bottom-0 left-0 right-0 p-4 bg-white shadow-lg"><button onClick={()=>{if(confirm("تسليم؟"))submit();}} className="w-full max-w-3xl mx-auto block bg-green-500 text-white font-bold py-3 rounded">تسليم النهائي</button></div>
        </div>
    );
}
const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
</script>
</body>
</html>
