            700: '#001f60',

          }

<style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; color: #0f172a; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 4px; }

    /* منع السكرين شوت والنسخ وقت الامتحان فقط */

    .exam-protected {
        -webkit-touch-callout: none; -webkit-user-select: none; -khtml-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
    }
    
    /* تأثيرات حركية خفيفة */
    .fade-in { animation: fadeIn 0.4s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

// إعدادات فايربيز مع تفعيل الجلسة الدائمة
const firebaseConfig = { apiKey: "AIzaSyAkSD8k1Q4_gSwar3mwfDPVpUPWzHJevNk", authDomain: "geox-platform.firebaseapp.com", databaseURL: "https://geox-platform-default-rtdb.firebaseio.com", projectId: "geox-platform", storageBucket: "geox-platform.firebasestorage.app", messagingSenderId: "691272759644", appId: "1:691272759644:web:297e11465b2fbe83ef6999", measurementId: "G-HVEFX0HGMM" };
if(!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
    firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);
}
const auth = firebase.auth(); const db = firebase.firestore(); const googleProvider = new firebase.auth.GoogleAuthProvider();
googleProvider.setCustomParameters({ prompt: 'select_account' });

// حسابات الإدارة
const ADMIN_EMAILS = ["abdoo.ashraf353@gmail.com", "yousef74joe74@gmail.com"];

// الأفاتار كصور مرفوعة
const AVATARS = [ {id:1, src:'avatar1.png'}, {id:2, src:'avatar2.png'}, {id:3, src:'avatar3.png'}, {id:4, src:'avatar4.png'}, {id:5, src:'avatar5.png'} ];

// دالة عرض الأفاتار
const RenderAvatar = ({ avatarValue, sizeClass="w-16 h-16" }) => {
    if(!avatarValue) return <img src="avatar1.png" alt="User" className={`${sizeClass} rounded-full object-cover shadow-md border-2 border-white`} onError={e=>e.target.src='https://cdn-icons-png.flaticon.com/512/149/149071.png'}/>;
    if(avatarValue.includes('.png') || avatarValue.includes('.jpg')) {
        return <img src={avatarValue} alt="User" className={`${sizeClass} rounded-full object-cover shadow-md border-2 border-white bg-slate-100`} onError={e=>e.target.src='https://cdn-icons-png.flaticon.com/512/149/149071.png'}/>;
    }
    return <div className={`flex items-center justify-center bg-raya-50 text-raya-600 rounded-full shadow-md border-2 border-white ${sizeClass}`}><span style={{fontSize:'200%'}}>{avatarValue}</span></div>;
};

// دالة عرض اللوجو
const CompanyLogo = ({ className }) => (
    <div className="flex items-center justify-center">
        <img src="logo.png" alt="Company Logo" className={className} onError={(e)=>{e.target.style.display='none'; e.target.nextSibling.style.display='block';}} />
        <span className={`font-black text-raya-800 tracking-wider hidden ${className.includes('h-20') ? 'text-5xl' : 'text-2xl'}`}>المنصة الرئيسية</span>
    </div>
);

function App() {
    const [user, setUser] = useState(null); const [dbUser, setDbUser] = useState(null); const [role, setRole] = useState(null); const [brandInput, setBrandInput] = useState(''); const [view, setView] = useState('login'); const [loading, setLoading] = useState(true);
    
    useEffect(() => {
        const timer = setTimeout(() => { if(loading) setLoading(false); }, 8000);
        const unsubscribe = auth.onAuthStateChanged(async (currentUser) => {
            try {
                if(currentUser) {
                    const email = currentUser.email;
                    if(ADMIN_EMAILS.includes(email)) { setRole('admin'); setUser(currentUser); setView('admin'); setLoading(false); return; }
                    
                    const userDoc = await db.collection('users').doc(email).get();
                    if(userDoc.exists) {
                        const data = userDoc.data();
                        setUser(currentUser); setDbUser(data); setRole('user'); setView('dashboard');
                    }
                    // تم إزالة الطرد التلقائي هنا للسماح لعملية إنشاء الحساب بالاستمرار
                } else { setUser(null); setRole(null); setView('login'); }
            } catch(error) { console.error(error); setView('login'); } finally { setLoading(false); clearTimeout(timer); }
        });
        return () => { unsubscribe(); clearTimeout(timer); };
    }, []);

    const handleGoogleLogin = async () => {
        try {
            setLoading(true); const result = await auth.signInWithPopup(googleProvider); const email = result.user.email;
            if(ADMIN_EMAILS.includes(email)) {
                setRole('admin'); setUser(result.user); setView('admin'); setLoading(false); return;
            }
            
            const userDocRef = db.collection('users').doc(email); const userDoc = await userDocRef.get();
            
            if(!userDoc.exists) {
                if(!brandInput.trim()) { alert("تنبيه: اكتب اسم البراند أولاً، ثم اضغط تسجيل دخول."); await auth.signOut(); setLoading(false); return; }
                const newData = { name: result.user.displayName || email.split('@')[0], email: email, brand: brandInput.trim(), status: 'active', hasExamined: false, score: 0, timeTaken: 0, avatar: 'avatar1.png', mistakes: [] };
                await userDocRef.set(newData);
                setDbUser(newData); setUser(result.user); setRole('user'); setView('dashboard');
            } else {
                setDbUser(userDoc.data()); setUser(result.user); setRole('user'); setView('dashboard');
            }
        } catch(error) { if(error.code !== 'auth/popup-closed-by-user') alert("خطأ في الاتصال. تأكد من الإنترنت."); } finally { setLoading(false); }
    };

    const handleLogout = async () => { if(window.confirm("هل تريد تسجيل الخروج؟")) { await auth.signOut(); window.location.reload(); } };
    
    if(loading) return <div className="flex flex-col h-screen items-center justify-center bg-slate-50"><div className="w-14 h-14 border-4 border-raya-500 border-t-transparent rounded-full animate-spin mb-4"></div><div className="text-raya-800 font-bold text-lg animate-pulse">جاري تسجيل الدخول...</div></div>;

    return (
        <div className="min-h-screen flex flex-col bg-slate-50">
            {user && (
                <header className="bg-white border-b border-slate-200 sticky top-0 z-40 shadow-sm">
                    <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
                        <div className="flex gap-3 items-center">
                            <button onClick={handleLogout} className="text-sm font-semibold text-slate-600 hover:text-slate-900 bg-slate-100 hover:bg-slate-200 px-4 py-2 rounded-lg transition-colors border border-slate-200">خروج</button>
                            {role === 'user' && dbUser?.mistakes?.length > 0 && <button onClick={() => alert("مراجعة الأخطاء السابقة:\n\n" + dbUser.mistakes.map(m => `السؤال: ${m.q}\nإجابتك: ${m.userAns}\nالصحيح: ${m.correctAns}`).join('\n\n---\n'))} className="text-sm font-semibold text-rose-600 bg-rose-50 hover:bg-rose-100 px-4 py-2 rounded-lg transition-colors border border-rose-200 flex items-center gap-2"> بنك أخطائي</button>}
                        </div>
                        <div className="flex items-center gap-4">
                            {role === 'admin' && <span className="bg-raya-50 text-raya-800 text-xs font-bold px-3 py-1 rounded-md border border-raya-200">مدير النظام</span>}
                            <CompanyLogo className="h-8 md:h-10 object-contain" />
                        </div>
                    </div>
                </header>
            )}
            
            <main className="flex-grow p-4 md:p-8">
                {view === 'login' && (
                    <div className="flex flex-col items-center justify-center min-h-[80vh] fade-in">
                        <div className="bg-white p-8 md:p-12 rounded-3xl shadow-xl border border-slate-100 w-full max-w-md text-center relative overflow-hidden">
                            <div className="absolute top-0 left-0 w-full h-2 bg-raya-500"></div>
                            <CompanyLogo className="h-16 mx-auto mb-6 object-contain" />
                            <h1 className="text-4xl font-black text-raya-800 mb-2 tracking-wide hidden">RAYA</h1>
                            <p className="text-raya-800 font-bold text-lg mb-10">العروض المتاحة حاليا</p>
                            
                            <div className="space-y-6">
                                <div className="text-right">
                                    <label className="block text-sm font-bold text-slate-700 mb-2">اسم البراند</label>
                                    <input type="text" placeholder="" className="w-full p-4 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-raya-500 focus:border-raya-500 outline-none transition font-medium text-slate-800" value={brandInput} onChange={e => setBrandInput(e.target.value)} />
                                </div>
                                <button onClick={handleGoogleLogin} className="w-full bg-raya-500 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-raya-600 transition flex items-center justify-center gap-3 active:scale-95 text-lg border border-raya-600">
                                    تسجيل دخول
                                </button>
                            </div>
                            <p className="mt-6 text-xs font-semibold text-slate-400 bg-slate-50 p-3 rounded-lg">إذا كنت مسجلاً مسبقاً، اترك خانة البراند فارغة واضغط تسجيل دخول.</p>
                        </div>
                    </div>
                )}
                {view === 'admin' && <AdminPanel />}
                {view === 'dashboard' && role === 'user' && <UserDashboard user={user} dbUser={dbUser} setDbUser={setDbUser} onStartExam={() => setView('exam')} />}
                {view === 'exam' && role === 'user' && <ExamRoom user={user} onFinish={(s,m,t) => { alert(`تم الاعتماد بنجاح!\n\nالنتيجة النهائية: ${s}/6\nالوقت المستغرق: ${t} ثانية`); setDbUser(p=>({...p,hasExamined:true,score:s,mistakes:m,timeTaken:t})); setView('dashboard'); }} />}
            </main>
        </div>
    );
}

function AdminPanel() {
    const [users, setUsers] = useState([]); const [settings, setSettings] = useState({examActive:false,questionsPool:[],offers:[]}); 
    const [search, setSearch] = useState('');
    const [offersJSON, setOffersJSON] = useState('');
    const [questionsJSON, setQuestionsJSON] = useState('');
    const [mistakesModal, setMistakesModal] = useState(null);

    useEffect(() => {
        db.collection('users').onSnapshot(s => setUsers(s.docs.map(d => ({id:d.id,...d.data()}))));
        db.collection('settings').doc('main').onSnapshot(d => {
            if(d.exists) {
                const data = d.data(); setSettings(data);
                if(!offersJSON) setOffersJSON(JSON.stringify(data.offers || [], null, 2));
                if(!questionsJSON) setQuestionsJSON(JSON.stringify(data.questionsPool || [], null, 2));
            } else db.collection('settings').doc('main').set({examActive:false,questionsPool:[],offers:[]});
        });
    }, []);

    const toggleExam = () => db.collection('settings').doc('main').update({examActive:!settings.examActive});
    const startNewExam = async () => {
        if(window.confirm("تأكيد: سيتم تصفير نتيجة الامتحان لجميع الموظفين المقبولين ليتمكنوا من دخول الامتحان الجديد؟")) {
            const batch = db.batch();
            users.forEach(u => {
                if(u.status === 'active') batch.update(db.collection('users').doc(u.id), { hasExamined: false, score: 0, timeTaken: 0, mistakes: [] });
            });
            await batch.commit();
            alert("تم تصفير النتائج بنجاح وتجهيز النظام للعرض الجديد!");
        }
    };

    const saveJSON = async (type) => {
        try {
            const raw = type === 'offers' ? offersJSON : questionsJSON;
            const parsed = JSON.parse(raw);
            if(type === 'questionsPool' && (!Array.isArray(parsed) || parsed.length < 6)) { alert("خطأ: يجب أن يحتوي بنك الأسئلة على 6 أسئلة على الأقل."); return; }
            await db.collection('settings').doc('main').update({ [type]: JSON.parse(JSON.stringify(parsed)) });
            alert("تم الحفظ في قاعدة البيانات بنجاح!");
        } catch(e) { alert("خطأ في صيغة الـ JSON! يرجى مراجعة الأقواس والفواصل."); }
    };

    const exportEx = () => { 
        const formattedData = users.map(u => ({ 'الاسم': u.name, 'البريد الإلكتروني': u.email, 'البراند': u.brand, 'حالة الحساب': u.status === 'active' ? 'مقبول' : 'مرفوض/مراجعة', 'أدى الامتحان': u.hasExamined ? 'نعم' : 'لا', 'الدرجة (من 6)': u.hasExamined ? u.score : '-', 'الوقت (ثواني)': u.hasExamined ? u.timeTaken : '-' }));
        const ws = XLSX.utils.json_to_sheet(formattedData); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "تقرير النتائج"); XLSX.writeFile(wb, "Corporate_Report.xlsx"); 
    };

    const activeUsers = users.filter(u => (u.name.includes(search) || u.brand.includes(search)) && u.status === 'active');
    const pendingUsers = users.filter(u => u.status === 'pending');

    return (
        <div className="max-w-7xl mx-auto space-y-8 fade-in">
            <div className="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-6">
                <div className="text-center md:text-right">
                    <h2 className="text-3xl font-black text-raya-800 mb-2">لوحة تحكم الإدارة</h2>
                    <div className="flex items-center justify-center md:justify-start gap-2 text-sm font-bold bg-slate-50 inline-flex px-4 py-2 rounded-lg border border-slate-100">
                        حالة التقييم: <span className={`flex items-center gap-1.5 ${settings.examActive?'text-emerald-600':'text-rose-600'}`}>
                            <span className={`w-2.5 h-2.5 rounded-full ${settings.examActive?'bg-emerald-500':'bg-rose-500'} animate-pulse`}></span>
                            {settings.examActive?"مُتاح للموظفين":"مغلق حالياً"}
                        </span>
                    </div>
                </div>
                <div className="flex gap-3 flex-wrap justify-center">
                    <button onClick={toggleExam} className={`px-6 py-3 rounded-xl font-bold text-white shadow-sm transition-all border ${settings.examActive ? 'bg-rose-600 hover:bg-rose-700 border-rose-700' : 'bg-emerald-600 hover:bg-emerald-700 border-emerald-700'}`}>{settings.examActive ? 'إغلاق نافذة الامتحان' : 'إتاحة الامتحان للجميع'}</button>
                    <button onClick={startNewExam} className="bg-raya-500 hover:bg-raya-600 text-white px-6 py-3 rounded-xl font-bold shadow-sm transition-all border border-raya-600">تصفير النتائج وإطلاق عرض جديد</button>
                </div>
            </div>
            
            <div className="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div className="bg-white p-8 rounded-3xl shadow-sm border border-slate-200 flex flex-col">
                    <div className="flex justify-between items-center mb-6">
                        <h3 className="font-black text-xl text-slate-800">إدارة نصوص وصور العروض (JSON)</h3>
                        <span className="bg-raya-50 text-raya-700 px-3 py-1 rounded-lg text-sm font-bold border border-raya-100">{settings.offers?.length||0} عروض</span>
                    </div>
                    <textarea dir="ltr" className="w-full flex-grow h-56 p-5 border border-slate-200 rounded-2xl text-left font-mono text-sm focus:ring-4 focus:ring-raya-500/20 focus:border-raya-500 outline-none mb-5 resize-none bg-slate-50 text-slate-700 shadow-inner" value={offersJSON} onChange={e=>setOffersJSON(e.target.value)}></textarea>
                    <button onClick={()=>saveJSON('offers')} className="bg-slate-800 text-white font-bold py-4 rounded-xl shadow-md hover:bg-slate-900 transition-colors">حفظ واعتماد العروض</button>
                </div>
                <div className="bg-white p-8 rounded-3xl shadow-sm border border-slate-200 flex flex-col">
                    <div className="flex justify-between items-center mb-6">
                        <h3 className="font-black text-xl text-slate-800">إدارة بنك الأسئلة (JSON)</h3>
                        <span className="bg-raya-50 text-raya-700 px-3 py-1 rounded-lg text-sm font-bold border border-raya-100">{settings.questionsPool?.length||0} أسئلة بالبنك</span>
                    </div>
                    <textarea dir="ltr" className="w-full flex-grow h-56 p-5 border border-slate-200 rounded-2xl text-left font-mono text-sm focus:ring-4 focus:ring-raya-500/20 focus:border-raya-500 outline-none mb-5 resize-none bg-slate-50 text-slate-700 shadow-inner" value={questionsJSON} onChange={e=>setQuestionsJSON(e.target.value)}></textarea>
                    <button onClick={()=>saveJSON('questionsPool')} className="bg-slate-800 text-white font-bold py-4 rounded-xl shadow-md hover:bg-slate-900 transition-colors">حفظ واعتماد بنك الأسئلة</button>
                </div>
            </div>

            {pendingUsers.length > 0 && (
                <div className="bg-amber-50 p-8 rounded-3xl border border-amber-200 shadow-sm">
                    <h3 className="text-xl font-black text-amber-900 mb-6 flex items-center gap-2">⏳ طلبات تسجيل بانتظار الموافقة والتفعيل ({pendingUsers.length})</h3>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                        {pendingUsers.map(u => (
                            <div key={u.id} className="bg-white p-5 rounded-2xl shadow-sm border border-amber-100 flex justify-between items-center">
                                <div><p className="font-black text-slate-800">{u.name}</p><p className="text-sm font-bold text-raya-600 mt-1 bg-raya-50 inline-block px-2 py-0.5 rounded">{u.brand}</p></div>
                                <div className="flex gap-2">
                                    <button onClick={()=>db.collection('users').doc(u.email).update({status: 'active'})} className="bg-emerald-100 hover:bg-emerald-200 text-emerald-700 px-4 py-2 rounded-xl text-sm font-bold transition">قبول</button>
                                    <button onClick={()=>db.collection('users').doc(u.email).delete()} className="bg-rose-100 hover:bg-rose-200 text-rose-700 px-4 py-2 rounded-xl text-sm font-bold transition">رفض</button>
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            )}

            <div className="bg-white rounded-3xl shadow-sm border border-slate-200 overflow-hidden flex flex-col">
                <div className="p-8 border-b border-slate-100 flex justify-between items-center flex-wrap gap-4 bg-slate-50">
                    <h3 className="text-2xl font-black text-raya-800">سجل الموظفين والتقييم ({activeUsers.length})</h3>
                    <div className="flex gap-3 w-full md:w-auto">
                        <input type="text" placeholder="بحث باسم الموظف أو البراند..." className="flex-grow md:w-72 border border-slate-300 p-3 rounded-xl bg-white outline-none focus:ring-2 focus:ring-raya-500 font-bold text-sm" onChange={e=>setSearch(e.target.value)} />
                        <button onClick={exportEx} className="bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-3 rounded-xl font-bold shadow-sm transition flex items-center gap-2 text-sm">تصدير التقرير (Excel)</button>
                    </div>
                </div>
                <div className="overflow-x-auto p-2">
                    <table className="w-full text-right border-collapse">
                        <thead className="text-slate-500 text-sm">
                            <tr><th className="p-5 font-bold border-b border-slate-100">بيانات الموظف</th><th className="p-5 font-bold border-b border-slate-100">البراند</th><th className="p-5 font-bold border-b border-slate-100 text-center">حالة الامتحان</th><th className="p-5 font-bold border-b border-slate-100 text-center">النتيجة والوقت</th><th className="p-5 font-bold border-b border-slate-100 text-center">التفاصيل</th><th className="p-5 font-bold border-b border-slate-100 text-center">إدارة</th></tr>
                        </thead>
                        <tbody className="divide-y divide-slate-50">
                            {activeUsers.map(u => (
                                <tr key={u.id} className="hover:bg-raya-50/50 transition-colors group">
                                    <td className="p-5"><div className="font-black text-slate-800 text-lg group-hover:text-raya-700 transition-colors">{u.name}</div><div className="text-xs font-semibold text-slate-400 mt-1">{u.email}</div></td>
                                    <td className="p-5"><span className="font-bold text-slate-700 bg-slate-100 px-3 py-1 rounded-lg">{u.brand}</span></td>
                                    <td className="p-5 text-center">{u.hasExamined ? <span className="inline-block bg-emerald-50 text-emerald-600 px-4 py-1.5 rounded-full text-sm font-bold border border-emerald-100">مكتمل</span> : <span className="inline-block bg-slate-50 text-slate-500 px-4 py-1.5 rounded-full text-sm font-bold border border-slate-200">في الانتظار</span>}</td>
                                    <td className="p-5 text-center">{u.hasExamined ? <div className="inline-flex flex-col items-center"><span className="text-xl font-black text-raya-800 bg-raya-50 px-3 rounded-lg border border-raya-100">{u.score}/6</span><span className="text-xs font-bold text-slate-500 mt-2">⏱ {u.timeTaken} ثانية</span></div> : <span className="text-slate-300">-</span>}</td>

            {/* Modal عرض الأخطاء للمدير */}

                <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                    <div className="bg-white rounded-3xl shadow-2xl w-full max-w-2xl max-h-[85vh] flex flex-col overflow-hidden animate-[fadeIn_0.2s_ease-out]">

                            <div><h3 className="font-black text-2xl text-raya-800">سجل أخطاء: {mistakesModal.name}</h3><p className="text-sm font-bold text-slate-500 mt-2 bg-white inline-block px-3 py-1 rounded-lg border border-slate-200">القسم: {mistakesModal.brand} | النتيجة: {mistakesModal.score}/6</p></div>
                            <button onClick={()=>setMistakesModal(null)} className="w-10 h-10 flex items-center justify-center rounded-full bg-slate-200 text-slate-600 hover:bg-rose-500 hover:text-white transition font-bold text-xl">&times;</button>
                        </div>
                        <div className="p-6 overflow-y-auto space-y-5 bg-slate-50/50 flex-grow">
                            {mistakesModal.mistakes.map((m, i) => (
                                <div key={i} className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm relative overflow-hidden">
                                    <div className="absolute right-0 top-0 bottom-0 w-1.5 bg-rose-400"></div>
                                    <p className="font-black text-slate-800 mb-4 text-lg leading-relaxed"><span className="text-rose-500 ml-1">س{i+1}:</span> {m.q}</p>
                                    <div className="space-y-3 bg-slate-50 p-4 rounded-xl border border-slate-100">
                                        <p className="text-sm flex flex-col md:flex-row md:items-center gap-2"><span className="text-rose-700 font-bold bg-rose-100 px-3 py-1 rounded-md text-xs shrink-0 w-fit">إجابة الموظف:</span> <span className="font-bold text-slate-700">{m.userAns}</span></p>
                                        <p className="text-sm flex flex-col md:flex-row md:items-center gap-2"><span className="text-emerald-700 font-bold bg-emerald-100 px-3 py-1 rounded-md text-xs shrink-0 w-fit">الإجابة الصحيحة:</span> <span className="font-black text-emerald-700">{m.correctAns}</span></p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            )}
        </div>
    );
}

function ExamRoom({ user, onFinish }) {
    const [qs, setQs] = useState([]); const [ans, setAns] = useState({}); const [cd, setCd] = useState(3); const [time, setTime] = useState(300); const [on, setOn] = useState(false); const [isSubmitting, setIsSubmitting] = useState(false);
    const ansRef = useRef({}); const timeRef = useRef(300); const warnings = useRef(0);

    useEffect(() => { 
        db.collection('settings').doc('main').get().then(d => { 
            if(d.exists && d.data().questionsPool?.length >= 6) {
                const pool = d.data().questionsPool;
                const shuffled = [...pool].sort(()=>0.5-Math.random()).slice(0,6);
                const processed = shuffled.map(q => {
                    const opts = q.options.map((t,i)=>({t,i})).sort(()=>0.5-Math.random()); 
                    let corIdx = opts.findIndex(o=>o.i===Number(q.correct)); if(corIdx===-1) corIdx=0; 
                    return{q:q.question, opts:opts.map(o=>o.t), cor:corIdx};
                });
                setQs(processed);
            } else { alert("نعتذر، لا توجد أسئلة كافية لبدء التقييم. يرجى مراجعة الإدارة."); window.location.reload(); } 
        }); 
    }, []);
    
    useEffect(() => { if(qs.length>0&&cd>0) setTimeout(()=>setCd(cd-1),1000); else if(qs.length>0&&cd===0) setOn(true); }, [cd, qs]);
    
    useEffect(() => { 
        if(on && time>0 && !isSubmitting) { const timerId = setTimeout(()=>{ setTime(time-1); timeRef.current = time-1; }, 1000); return () => clearTimeout(timerId); } 
        else if(on && time===0 && !isSubmitting) submit(true); 
    }, [on, time, isSubmitting]);

    useEffect(() => {
        const handleCheat = () => {
            if(on && !isSubmitting) {
                warnings.current += 1;
                if(warnings.current === 1) {
                    alert("⚠️ إنذار أمني (1/2): يمنع الخروج من شاشة التقييم أو فتح تطبيقات أخرى! إذا تكرر ذلك سيتم سحب الورقة واعتماد إجاباتك الحالية فوراً.");
                } else if(warnings.current >= 2) {
                    alert("🚫 تم سحب ورقة التقييم واعتمادها تلقائياً لمخالفة القواعد الأمنية للمرة الثانية.");
                    submit(true);
                }
            }
        };

        const onVisibilityChange = () => { if(document.hidden) handleCheat(); };
        const onBlur = () => { handleCheat(); };
        const onKeyDown = (e) => { if(e.key === 'PrintScreen') { navigator.clipboard.writeText(''); alert('حماية النظام: غير مسموح بالتقاط صور للشاشة أثناء التقييم.'); } };

        if(on) {
            document.body.classList.add('exam-protected');
            document.addEventListener('visibilitychange', onVisibilityChange);
            window.addEventListener('blur', onBlur);
            window.addEventListener('keyup', onKeyDown);
        }

        return () => {
            document.body.classList.remove('exam-protected');
            document.removeEventListener('visibilitychange', onVisibilityChange);
            window.removeEventListener('blur', onBlur);
            window.removeEventListener('keyup', onKeyDown);
        };
    }, [on, isSubmitting]);
    
    const submit = async(isForced = false) => { 
        if(isSubmitting) return; setIsSubmitting(true);
        try {
            let s=0; let m=[]; 
            qs.forEach((q,i) => {
                const answeredIdx = ansRef.current[i];
                if(answeredIdx===q.cor) s++;
                else {
                    let qText = q.q ? String(q.q) : "سؤال غير معروف";
                    let cText = q.opts && q.opts[q.cor] ? String(q.opts[q.cor]) : "بدون إجابة صحيحة";
                    let uText = answeredIdx !== undefined && q.opts && q.opts[answeredIdx] ? String(q.opts[answeredIdx]) : "لم يُجب";
                    m.push({q: qText, correctAns: cText, userAns: uText});
                }
            }); 
            const finalTime = 300 - timeRef.current;
            const payload = JSON.parse(JSON.stringify({ hasExamined: true, score: s, timeTaken: finalTime, mistakes: m }));
            await db.collection('users').doc(user.email).update(payload); 
            onFinish(s,m,finalTime);
        } catch(error) { alert("حدث خطأ في الشبكة أثناء الاعتماد: " + error.message); setIsSubmitting(false); }
    };
    
    const handleOptionSelect = (qIndex, optIndex) => {
        if(isSubmitting) return;
        const newAns = {...ansRef.current, [qIndex]: optIndex};
        ansRef.current = newAns; setAns(newAns);
    };

    if(!on) return <div className="flex items-center justify-center h-screen bg-slate-800"><div className="bg-white p-12 rounded-[3rem] shadow-2xl border-8 border-raya-500 text-center w-72 h-72 flex flex-col justify-center items-center transform transition-transform"><CompanyLogo className="h-10 mb-4 opacity-50" /><div className="text-raya-500 font-black mb-2 text-xl tracking-widest">تجهيز التقييم</div><div className="text-8xl text-raya-800 font-black animate-pulse">{cd}</div></div></div>;
    
    return (
        <div className="max-w-4xl mx-auto pb-32 pt-4 px-2 exam-protected fade-in">
            <div className="bg-white p-5 md:p-6 rounded-3xl shadow-md mb-8 sticky top-4 z-50 border-b-4 border-raya-500 flex justify-between items-center bg-opacity-95 backdrop-blur-md">
                <div className="text-xl font-black text-raya-800 hidden md:flex items-center gap-3"><span className="w-3 h-3 rounded-full bg-rose-500 animate-ping"></span> تقييم المنصة</div>
                <div className="flex gap-4 md:gap-8 items-center font-bold w-full md:w-auto justify-between md:justify-end">
                    <span className="text-slate-600 text-sm bg-slate-100 px-4 py-2 rounded-xl border border-slate-200 shadow-inner flex items-center gap-2">مكتمل: <span className="text-raya-700 font-black text-lg">{Object.keys(ans).length}</span>/6</span>
                    <span className={`text-2xl px-6 py-2 rounded-2xl border-2 shadow-sm font-mono ${time<60?'text-rose-600 bg-rose-50 border-rose-300 animate-pulse':'text-raya-800 bg-raya-50 border-raya-200'}`}>⏱ {Math.floor(time/60)}:{('0'+(time%60)).slice(-2)}</span>
                </div>
            </div>

            <div className="space-y-8">
                {qs.map((q,i)=>(
                    <div key={i} className="bg-white p-6 md:p-10 rounded-3xl shadow-sm border border-slate-200 hover:shadow-md transition-shadow relative overflow-hidden">
                        <div className="absolute right-0 top-0 bottom-0 w-2 bg-slate-200"></div>
                        <h3 className="text-xl md:text-2xl font-black mb-8 text-slate-800 flex gap-4 leading-relaxed items-start"><span className="bg-slate-100 text-slate-500 w-12 h-12 flex items-center justify-center rounded-2xl shrink-0 font-black shadow-inner text-xl border border-slate-200">{i+1}</span><span className="mt-1">{q.q}</span></h3>
                        <div className="space-y-4 pl-2 md:pl-12 pr-2">
                            {q.opts.map((o,idx)=>(
                                <div key={idx} onClick={()=>handleOptionSelect(i, idx)} className={`flex items-center p-5 md:p-6 rounded-2xl border-2 cursor-pointer transition-all ${ans[i]===idx?'bg-raya-50 border-raya-500 shadow-md ring-4 ring-raya-500/10 scale-[1.01]':'bg-white border-slate-200 hover:bg-slate-50 hover:border-slate-300'}`}>
                                    <div className={`w-6 h-6 md:w-8 md:h-8 rounded-full border-2 ml-4 flex items-center justify-center shrink-0 bg-white transition-colors ${ans[i]===idx?'border-raya-600':'border-slate-300'}`}>{ans[i]===idx&&<div className="w-3 h-3 md:w-4 md:h-4 bg-raya-600 rounded-full"></div>}</div>
                                    <span className={`text-lg md:text-xl font-bold ${ans[i]===idx?'text-raya-800':'text-slate-600'}`}>{o}</span>
                                </div>
                            ))}
                        </div>
                    </div>
                ))}
            </div>

            <div className="fixed bottom-0 left-0 right-0 p-5 bg-white border-t border-slate-200 shadow-[0_-15px_30px_-15px_rgba(0,0,0,0.1)] z-40">
                <button disabled={isSubmitting} onClick={()=>{if(window.confirm("تأكيد أخير: هل أنت متأكد من تسليم الإجابات النهائية واعتماد التقييم؟ لا يمكنك التراجع بعد هذه الخطوة."))submit();}} className={`w-full max-w-4xl mx-auto flex justify-center items-center gap-3 ${isSubmitting ? 'bg-slate-400' : 'bg-raya-500 hover:bg-raya-600'} text-white font-black text-xl py-5 md:py-6 rounded-2xl shadow-xl transition-all transform active:scale-[0.98] border border-transparent hover:border-raya-700`}>
                    {isSubmitting ? 'جاري التشفير والاعتماد...' : 'تسليم التقييم النهائي'}
                </button>
            </div>
        </div>
    );
}

const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
</script>
