<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAYA - منصة العروض والامتحانات</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <style>
        body {
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8fafc;
        }
        .avatar-option { cursor: pointer; transition: transform 0.2s; }
        .avatar-option:hover { transform: scale(1.1); }
        .selected-avatar { border: 4px solid #3b82f6; border-radius: 50%; background-color: #eff6ff; }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>

    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- SheetJS (Excel) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <!-- Firebase v9 Compat (CDN) -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // إعدادات Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAUfiVn9d6ssAXyJebJZE9lHzEXIzf38dc",
            authDomain: "raya-a4bb5.firebaseapp.com",
            projectId: "raya-a4bb5",
            storageBucket: "raya-a4bb5.firebasestorage.app",
            messagingSenderId: "698811790975",
            appId: "1:698811790975:web:9be89e4ecfefd6afe6714a",
            measurementId: "G-CN04VMJKC2"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        
        const auth = firebase.auth();
        const db = firebase.firestore();
        const googleProvider = new firebase.auth.GoogleAuthProvider();
        
        // إجبار جوجل على إظهار نافذة اختيار الحساب دائماً لتجنب التعليق
        googleProvider.setCustomParameters({ prompt: 'select_account' });

        const ADMIN_EMAIL = "abdoo.ashraf353@gmail.com";

        const AVATARS = [
            { id: 1, name: 'سبونج بوب', icon: '🧽' },
            { id: 2, name: 'شفيق', icon: '🦑' },
            { id: 3, name: 'بسيط', icon: '⭐' },
            { id: 4, name: 'جاد جداً', icon: '💼' },
            { id: 5, name: 'مضحك', icon: '🤡' }
        ];

        // ==========================================
        // 1. التطبيق الرئيسي (نظام التوجيه)
        // ==========================================
        function App() {
            const [user, setUser] = useState(null);
            const [dbUser, setDbUser] = useState(null);
            const [role, setRole] = useState(null); 
            const [brandInput, setBrandInput] = useState('');
            const [view, setView] = useState('login'); 
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                // مؤقت لإخفاء شاشة التحميل إذا تعذر الاتصال
                const timer = setTimeout(() => setLoading(false), 5000);

                const unsubscribe = auth.onAuthStateChanged(async (currentUser) => {
                    clearTimeout(timer);
                    try {
                        if (currentUser) {
                            const email = currentUser.email;
                            
                            // 1. إذا كان المدير
                            if (email === ADMIN_EMAIL) {
                                setRole('admin');
                                setUser(currentUser);
                                setView('admin');
                                setLoading(false);
                                return;
                            }

                            // 2. إذا كان مستخدم عادي، فحص قاعدة البيانات
                            const userDocRef = db.collection('users').doc(email);
                            const userDoc = await userDocRef.get();
                            
                            if (userDoc.exists) {
                                const data = userDoc.data();
                                if (data.status === 'pending') {
                                    alert("حسابك قيد المراجعة من الإدارة. سيتم تفعيل حسابك قريباً.");
                                    await auth.signOut();
                                    setUser(null);
                                    setView('login');
                                } else if (data.status === 'active') {
                                    setUser(currentUser);
                                    setDbUser(data);
                                    setRole('user');
                                    setView('dashboard');
                                }
                            } else {
                                // حسابه مسجل بجوجل لكن ليس له ملف بالداتا بيز (نسي يكتب البراند)
                                await auth.signOut();
                                setUser(null);
                                setView('login');
                            }
                        } else {
                            setUser(null);
                            setRole(null);
                            setView('login');
                        }
                    } catch (error) {
                        console.error("Auth Listener Error:", error);
                        setView('login');
                    } finally {
                        setLoading(false);
                    }
                });
                
                return () => { unsubscribe(); clearTimeout(timer); };
            }, []);

            const handleGoogleLogin = async () => {
                try {
                    setLoading(true);
                    const result = await auth.signInWithPopup(googleProvider);
                    const email = result.user.email;

                    if (email === ADMIN_EMAIL) return; // يتم معالجته في onAuthStateChanged

                    const userDocRef = db.collection('users').doc(email);
                    const userDoc = await userDocRef.get();

                    // إذا كان مستخدم جديد تماماً
                    if (!userDoc.exists) {
                        if (!brandInput || brandInput.trim() === '') {
                            alert("تنبيه: أنت مستخدم جديد! يجب أن تكتب اسم البراند الخاص بك في المربع أولاً، ثم تضغط على زر الدخول.");
                            await auth.signOut();
                            setLoading(false);
                            return;
                        }
                        
                        // إنشاء حسابه ووضعه قيد المراجعة
                        await userDocRef.set({
                            name: result.user.displayName || email.split('@')[0],
                            email: email,
                            brand: brandInput.trim(),
                            status: 'pending', // بانتظار المدير
                            hasExamined: false,
                            score: 0,
                            timeTaken: 0,
                            avatar: '🧽',
                            mistakes: []
                        });
                        
                        alert("تم إرسال طلب تسجيلك للبراند (" + brandInput + ") بنجاح! سيتم مراجعته من الإدارة.");
                        await auth.signOut();
                    }
                } catch (error) {
                    if(error.code !== 'auth/popup-closed-by-user') {
                        alert("حدث خطأ في التسجيل. تأكد من أن الموقع مرفوع على رابط حقيقي (Domain).");
                    }
                } finally {
                    setLoading(false);
                }
            };

            const handleLogout = async () => {
                if(confirm("هل تريد تسجيل الخروج؟")) {
                    await auth.signOut();
                    window.location.reload();
                }
            };

            if (loading) {
                return (
                    <div className="flex flex-col h-screen items-center justify-center bg-gray-50">
                        <div className="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-4"></div>
                        <div className="text-xl font-bold text-blue-800">جاري التحميل...</div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col bg-gray-50">
                    {/* الهيدر العلوي */}
                    {user && (
                        <div className="bg-white shadow p-4 flex justify-between items-center sticky top-0 z-50">
                            <div className="flex items-center gap-3">
                                <button onClick={handleLogout} className="bg-gray-100 text-gray-700 px-4 py-2 rounded-lg font-semibold hover:bg-gray-200 transition">خروج</button>
                                {role === 'user' && dbUser?.mistakes?.length > 0 && (
                                    <button onClick={() => {
                                        const errorsText = dbUser.mistakes.map(m => `السؤال: ${m.q}\nإجابتك: ${m.userAns}\nالصحيح: ${m.correctAns}`).join('\n\n');
                                        alert("أخطاؤك في الامتحان الأخير:\n\n" + errorsText);
                                    }} className="bg-red-50 text-red-600 px-3 py-2 rounded-lg font-bold hover:bg-red-100 transition border border-red-100">
                                        ❌ بنك الأخطاء
                                    </button>
                                )}
                            </div>
                            <div className="flex items-center gap-2">
                                {role === 'admin' && <span className="bg-blue-100 text-blue-800 text-xs px-2 py-1 rounded font-bold">لوحة الإدارة</span>}
                                <h1 className="text-3xl font-extrabold text-blue-800 tracking-wider">RAYA</h1>
                            </div>
                        </div>
                    )}

                    <main className="flex-grow p-4">
                        {view === 'login' && (
                            <div className="flex flex-col items-center justify-center min-h-[85vh]">
                                <div className="bg-white p-8 md:p-10 rounded-2xl shadow-xl w-full max-w-md text-center border-t-8 border-blue-600">
                                    <h1 className="text-5xl font-extrabold text-blue-800 mb-2">RAYA</h1>
                                    <p className="text-gray-500 mb-8 font-semibold">بوابة العروض والامتحانات للموظفين</p>
                                    
                                    <div className="space-y-5">
                                        <div>
                                            <input 
                                                type="text" 
                                                placeholder="اكتب اسم البراند (للمستخدم الجديد فقط)" 
                                                className="w-full p-4 bg-gray-50 border border-gray-200 rounded-xl text-right focus:border-blue-500 focus:bg-white outline-none transition font-semibold" 
                                                value={brandInput}
                                                onChange={(e) => setBrandInput(e.target.value)}
                                            />
                                        </div>
                                        <button onClick={handleGoogleLogin} className="w-full bg-blue-600 text-white font-bold py-4 rounded-xl hover:bg-blue-700 transition shadow-md flex items-center justify-center gap-3">
                                            <span className="text-lg">دخول بواسطة حساب Google</span>
                                        </button>
                                    </div>
                                    <p className="mt-6 text-sm text-gray-400">إذا كان حسابك مسجل ومقبول، اترك البراند فارغاً واضغط دخول.</p>
                                </div>
                            </div>
                        )}

                        {view === 'admin' && <AdminPanel />}

                        {view === 'dashboard' && role === 'user' && (
                            <UserDashboard user={user} dbUser={dbUser} setDbUser={setDbUser} onStartExam={() => setView('exam')} />
                        )}

                        {view === 'exam' && role === 'user' && (
                            <ExamRoom user={user} onFinish={(score, mistakes, timeTaken) => {
                                alert(`انتهى الامتحان!\nالدرجة: ${score} من 6\nالوقت: ${timeTaken} ثانية`);
                                setDbUser(prev => ({...prev, hasExamined: true, score, mistakes, timeTaken}));
                                setView('dashboard');
                            }} />
                        )}
                    </main>
                </div>
            );
        }

        // ==========================================
        // 2. لوحة تحكم الإدارة (Admin)
        // ==========================================
        function AdminPanel() {
            const [users, setUsers] = useState([]);
            const [settings, setSettings] = useState({ examActive: false, questionsPool: [], offers: [] });
            const [searchTerm, setSearchTerm] = useState('');

            useEffect(() => {
                const unsubUsers = db.collection('users').onSnapshot(snap => {
                    const data = []; snap.forEach(d => data.push({ id: d.id, ...d.data() })); setUsers(data);
                });
                const unsubSettings = db.collection('settings').doc('main').onSnapshot(doc => {
                    if (doc.exists) setSettings(doc.data());
                    else db.collection('settings').doc('main').set({ examActive: false, questionsPool: [], offers: [] });
                });
                return () => { unsubUsers(); unsubSettings(); };
            }, []);

            const toggleExam = () => db.collection('settings').doc('main').update({ examActive: !settings.examActive });

            const startNewExam = async () => {
                if(confirm("سيتم تصفير نتيجة الامتحان لجميع الموظفين ليتمكنوا من دخول الامتحان الجديد. تأكيد؟")) {
                    const batch = db.batch();
                    users.forEach(u => {
                        if(u.status === 'active') {
                            batch.update(db.collection('users').doc(u.id), { hasExamined: false, score: 0, timeTaken: 0, mistakes: [] });
                        }
                    });
                    await batch.commit();
                    alert("تم فتح الامتحان للجميع!");
                }
            };

            const handleFile = (e, type) => {
                const reader = new FileReader();
                reader.onload = async (ev) => {
                    try {
                        const json = JSON.parse(ev.target.result);
                        await db.collection('settings').doc('main').update({ [type]: json });
                        alert("تم الحفظ بنجاح!");
                        e.target.value = null;
                    } catch(err) { alert("ملف JSON غير صالح!"); }
                };
                if(e.target.files[0]) reader.readAsText(e.target.files[0]);
            };

            const updateUserStatus = (email, status) => db.collection('users').doc(email).update({ status });
            const deleteUser = (email) => { if(confirm("حذف المستخدم نهائياً؟")) db.collection('users').doc(email).delete(); };

            const exportExcel = () => {
                const data = users.map(u => ({ 'الاسم': u.name, 'البريد': u.email, 'البراند': u.brand, 'الحالة': u.status === 'active'?'مقبول':'مراجعة', 'امتحن': u.hasExamined?'نعم':'لا', 'الدرجة': u.score||0, 'الوقت (ث)': u.timeTaken||0 }));
                const ws = XLSX.utils.json_to_sheet(data); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "التقرير"); XLSX.writeFile(wb, "RAYA_Report.xlsx");
            };

            const filtered = users.filter(u => u.name.includes(searchTerm) || u.brand.includes(searchTerm));

            return (
                <div className="max-w-7xl mx-auto space-y-6">
                    <div className="bg-white p-6 rounded-xl shadow-sm border-t-4 border-blue-800 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div>
                            <h2 className="text-2xl font-bold text-gray-800 mb-2">لوحة التحكم</h2>
                            <span className={`px-3 py-1 rounded font-bold text-sm ${settings.examActive ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}`}>
                                حالة الامتحان: {settings.examActive ? "مُفعل 🟢" : "مُعطل 🔴"}
                            </span>
                        </div>
                        <div className="flex gap-3 flex-wrap">
                            <button onClick={toggleExam} className={`px-6 py-2 rounded-lg font-bold text-white shadow-sm ${settings.examActive ? 'bg-red-500' : 'bg-green-500'}`}>{settings.examActive ? 'إيقاف الامتحان' : 'تفعيل الامتحان'}</button>
                            <button onClick={startNewExam} className="px-6 py-2 bg-blue-600 text-white font-bold rounded-lg shadow-sm">تصفير النتائج وبدء عرض جديد</button>
                        </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 relative">
                            <h3 className="font-bold mb-2">رفع العروض الحالية (JSON)</h3>
                            <input type="file" accept=".json" onChange={(e) => handleFile(e, 'offers')} className="w-full text-sm p-2 bg-gray-50 border rounded cursor-pointer" />
                            <p className="mt-2 text-xs text-gray-500">العروض الحالية: {settings.offers?.length||0}</p>
                        </div>
                        <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100 relative">
                            <h3 className="font-bold mb-2">رفع بنك الأسئلة (JSON)</h3>
                            <input type="file" accept=".json" onChange={(e) => handleFile(e, 'questionsPool')} className="w-full text-sm p-2 bg-gray-50 border rounded cursor-pointer" />
                            <p className="mt-2 text-xs text-gray-500">الأسئلة بالبنك: {settings.questionsPool?.length||0}</p>
                        </div>
                    </div>

                    <div className="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                        <div className="flex justify-between items-center mb-6 flex-wrap gap-4">
                            <h3 className="text-xl font-bold">سجل الموظفين ({users.length})</h3>
                            <div className="flex gap-3">
                                <input type="text" placeholder="بحث..." className="border p-2 rounded-lg bg-gray-50 outline-none" onChange={(e) => setSearchTerm(e.target.value)} />
                                <button onClick={exportExcel} className="bg-green-600 text-white px-4 py-2 rounded-lg font-bold">تصدير Excel</button>
                            </div>
                        </div>
                        
                        <div className="overflow-x-auto">
                            <table className="w-full text-right border-collapse whitespace-nowrap">
                                <thead>
                                    <tr className="bg-gray-50 border-b">
                                        <th className="p-3">الاسم</th><th className="p-3">البراند</th><th className="p-3">الحالة</th><th className="p-3">امتحن؟</th><th className="p-3">النتيجة</th><th className="p-3 text-center">إجراءات</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filtered.map(u => (
                                        <tr key={u.id} className="border-b hover:bg-gray-50">
                                            <td className="p-3 font-bold">{u.name}<br/><span className="text-xs text-gray-500 font-normal">{u.email}</span></td>
                                            <td className="p-3">{u.brand}</td>
                                            <td className="p-3">{u.status === 'pending' ? <span className="text-yellow-600 font-bold bg-yellow-100 px-2 py-1 rounded">مراجعة</span> : <span className="text-green-600 font-bold bg-green-100 px-2 py-1 rounded">مقبول</span>}</td>
                                            <td className="p-3">{u.hasExamined ? '✔️ نعم' : '❌ لا'}</td>
                                            <td className="p-3 font-bold text-blue-600">{u.hasExamined ? `${u.score}/6 - ${u.timeTaken}ث` : '-'}</td>
                                            <td className="p-3 flex gap-2 justify-center">
                                                {u.status === 'pending' && <button onClick={() => updateUserStatus(u.email, 'active')} className="bg-blue-100 text-blue-700 px-3 py-1 rounded font-bold hover:bg-blue-200">قبول</button>}
                                                <button onClick={() => deleteUser(u.email)} className="bg-red-100 text-red-700 px-3 py-1 rounded font-bold hover:bg-red-200">حذف</button>
                                            </td>
                                        </tr>
                                    ))}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 3. شاشة الموظف (Dashboard)
        // ==========================================
        function UserDashboard({ user, dbUser, setDbUser, onStartExam }) {
            const [settings, setSettings] = useState({ examActive: false, offers: [] });
            const [leaderboard, setLeaderboard] = useState([]);

            useEffect(() => {
                const unsubSettings = db.collection('settings').doc('main').onSnapshot(doc => {
                    if(doc.exists) setSettings(doc.data());
                });
                const unsubLeaderboard = db.collection('users').where('status', '==', 'active').where('hasExamined', '==', true)
                    .onSnapshot(snap => {
                        let data = []; snap.forEach(d => data.push(d.data()));
                        data.sort((a, b) => b.score - a.score || a.timeTaken - b.timeTaken); // ترتيب: درجة ثم وقت
                        setLeaderboard(data);
                    });
                return () => { unsubSettings(); unsubLeaderboard(); };
            }, []);

            const updateAvatar = (icon) => { setDbUser({...dbUser, avatar: icon}); db.collection('users').doc(user.email).update({ avatar: icon }); };
            const myRank = leaderboard.findIndex(u => u.email === user.email) + 1;

            return (
                <div className="max-w-4xl mx-auto space-y-6">
                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col md:flex-row items-center justify-between gap-6">
                        <div>
                            <h2 className="text-2xl font-bold">مرحباً، {dbUser.name} 👋</h2>
                            <p className="text-blue-600 font-bold bg-blue-50 inline-block px-4 py-1 rounded-full mt-2 border border-blue-100">براند: {dbUser.brand}</p>
                        </div>
                        <div className="text-center">
                            <div className="text-6xl bg-gray-50 p-2 rounded-full border-4 border-blue-100 inline-block mb-3">{dbUser.avatar}</div>
                            <div className="flex gap-3 text-3xl justify-center">
                                {AVATARS.map(av => <div key={av.id} onClick={() => updateAvatar(av.icon)} className={`avatar-option p-2 rounded-xl ${dbUser.avatar === av.icon ? 'bg-blue-100 border-2 border-blue-400' : 'bg-gray-50'}`}>{av.icon}</div>)}
                            </div>
                        </div>
                    </div>

                    <div className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border-t-4 border-blue-600 text-center">
                        <h2 className="text-2xl font-bold mb-6 text-gray-800">📢 العروض الحالية</h2>
                        <div className="bg-blue-50 border border-blue-100 rounded-xl p-6 mb-6 min-h-[120px] text-right">
                            {settings.offers?.length > 0 ? (
                                <ul className="space-y-3 font-semibold text-gray-700 text-lg">
                                    {settings.offers.map((o, i) => <li key={i}>📌 {o.title || o.text || JSON.stringify(o)}</li>)}
                                </ul>
                            ) : <p className="text-center text-gray-500 font-bold">لا توجد عروض حالياً.</p>}
                        </div>

                        {dbUser.hasExamined ? (
                            <div className="p-4 bg-green-50 text-green-700 rounded-xl font-bold text-lg border border-green-200">✅ قمت بأداء الامتحان المخصص لهذه العروض. انتظر العرض القادم!</div>
                        ) : (
                            <button onClick={onStartExam} disabled={!settings.examActive} className={`w-full md:w-2/3 mx-auto py-4 rounded-xl font-bold text-xl text-white shadow-md transition-all ${settings.examActive ? 'bg-blue-600 hover:bg-blue-700 transform hover:-translate-y-1' : 'bg-gray-400 cursor-not-allowed'}`}>
                                {settings.examActive ? 'فهمت العروض.. ابدأ الامتحان الآن' : '🔒 الامتحان مغلق حالياً'}
                            </button>
                        )}
                    </div>

                    <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                        <h2 className="text-2xl font-bold text-center text-yellow-800 mb-6">🏆 لوحة الشرف</h2>
                        {dbUser.hasExamined && myRank > 0 && <div className="mb-6 text-center font-bold text-blue-800 text-lg bg-blue-50 py-3 rounded-xl border border-blue-200">ترتيبك الحالي: المركز {myRank}</div>}
                        <div className="space-y-3">
                            {leaderboard.length === 0 && <p className="text-center text-gray-400">لا توجد نتائج مسجلة.</p>}
                            {leaderboard.map((u, i) => {
                                const isFirst = i === 0; const isSecond = i === 1; const isThird = i === 2;
                                return (
                                    <div key={i} className={`flex justify-between items-center p-4 rounded-xl font-bold border-2 ${isFirst?'bg-yellow-50 border-yellow-400 text-yellow-900':isSecond?'bg-gray-100 border-gray-300 text-gray-800':isThird?'bg-orange-50 border-orange-300 text-orange-900':'bg-white border-gray-100'}`}>
                                        <div className="flex items-center gap-4">
                                            <span className="text-xl w-6 text-center">{isFirst?'🥇':isSecond?'🥈':isThird?'🥉':i+1}</span>
                                            <span className="text-3xl bg-white rounded-full p-1 shadow-sm">{u.avatar}</span>
                                            <div>
                                                <div>{u.name}</div>
                                                <div className="text-xs font-normal opacity-75">{u.brand}</div>
                                            </div>
                                        </div>
                                        <div className="bg-white/50 px-3 py-1 rounded-lg text-left">
                                            <div className="text-blue-700 text-lg">{u.score}/6</div>
                                            <div className="text-xs">⏱ {u.timeTaken} ث</div>
                                        </div>
                                    </div>
                                )
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        // ==========================================
        // 4. غرفة الامتحان ونظام الحماية (Exam Engine)
        // ==========================================
        function ExamRoom({ user, onFinish }) {
            const [questions, setQuestions] = useState([]);
            const [answers, setAnswers] = useState({});
            const [countdown, setCountdown] = useState(3);
            const [timeLeft, setTimeLeft] = useState(300); // 5 دقائق
            const [started, setStarted] = useState(false);
            const initialTime = 300;

            useEffect(() => {
                db.collection('settings').doc('main').get().then(doc => {
                    if(doc.exists && doc.data().questionsPool && doc.data().questionsPool.length >= 6) {
                        const pool = doc.data().questionsPool;
                        // اختيار 6 أسئلة عشوائياً
                        const shuffled = [...pool].sort(() => 0.5 - Math.random()).slice(0, 6);
                        
                        // خلط ترتيب الإجابات (الخيارات) داخل كل سؤال
                        const processed = shuffled.map(q => {
                            const options = q.options.map((opt, i) => ({ text: opt, originalIndex: i }));
                            options.sort(() => 0.5 - Math.random());
                            const newCorrect = options.findIndex(o => o.originalIndex === q.correct);
                            return { question: q.question, options: options.map(o => o.text), correct: newCorrect };
                        });
                        setQuestions(processed);
                    } else {
                        alert("لا توجد أسئلة كافية في بنك الأسئلة. يرجى مراجعة الإدارة.");
                        window.location.reload();
                    }
                });
            }, []);

            useEffect(() => {
                if (questions.length > 0 && countdown > 0) {
                    const t = setTimeout(() => setCountdown(countdown - 1), 1000);
                    return () => clearTimeout(t);
                } else if (questions.length > 0 && countdown === 0) {
                    setStarted(true);
                }
            }, [countdown, questions]);

            useEffect(() => {
                if (started && timeLeft > 0) {
                    const t = setTimeout(() => setTimeLeft(timeLeft - 1), 1000);
                    return () => clearTimeout(t);
                } else if (started && timeLeft === 0) {
                    submitExam();
                }
            }, [started, timeLeft]);

            // منع الغش
            useEffect(() => {
                const handleCheat = () => {
                    if (document.hidden && started) {
                        alert("🚫 تم تسليم الامتحان بدرجة صفر لمخالفتك قواعد المراقبة والخروج من شاشة الامتحان.");
                        forceSubmitZero();
                    }
                };
                document.addEventListener('visibilitychange', handleCheat);
                return () => document.removeEventListener('visibilitychange', handleCheat);
            }, [started]);

            const forceSubmitZero = async () => {
                const timeTaken = initialTime - timeLeft;
                await db.collection('users').doc(user.email).update({ hasExamined: true, score: 0, timeTaken, mistakes: [] });
                onFinish(0, [], timeTaken);
            };

            const submitExam = async () => {
                let score = 0; let mistakes = [];
                questions.forEach((q, i) => {
                    if (answers[i] === q.correct) score += 1;
                    else mistakes.push({ q: q.question, correctAns: q.options[q.correct], userAns: answers[i] !== undefined ? q.options[answers[i]] : "لم يُجب" });
                });
                const timeTaken = initialTime - timeLeft;
                await db.collection('users').doc(user.email).update({ hasExamined: true, score, timeTaken, mistakes });
                onFinish(score, mistakes, timeTaken);
            };

            if (!started) return (
                <div className="flex justify-center items-center h-[70vh]">
                    <div className="bg-white p-12 rounded-full shadow-2xl border-8 border-blue-100 text-center w-64 h-64 flex flex-col justify-center">
                        <div className="text-blue-500 font-bold mb-2">استعد...</div>
                        <div className="text-8xl text-blue-700 font-extrabold animate-bounce">{countdown}</div>
                    </div>
                </div>
            );

            return (
                <div className="max-w-3xl mx-auto pb-24">
                    <div className="bg-white p-4 rounded-xl shadow-lg mb-6 sticky top-2 z-50 border-b-4 border-blue-600 flex justify-between items-center">
                        <div className="text-lg font-bold text-blue-900 hidden md:block">امتحان RAYA</div>
                        <div className="flex gap-4 items-center font-bold">
                            <span className="text-gray-500 text-sm">تمت الإجابة: {Object.keys(answers).length}/6</span>
                            <span className={`text-2xl px-4 py-1 rounded border-2 ${timeLeft < 60 ? 'text-red-600 bg-red-50 border-red-200 animate-pulse' : 'text-blue-700 bg-blue-50 border-blue-100'}`}>
                                ⏱ {Math.floor(timeLeft / 60)}:{('0' + (timeLeft % 60)).slice(-2)}
                            </span>
                        </div>
                    </div>

                    <div className="space-y-8">
                        {questions.map((q, i) => (
                            <div key={i} className="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-gray-100">
                                <h3 className="text-xl font-bold mb-6 text-gray-800 leading-relaxed flex gap-3">
                                    <span className="bg-blue-100 text-blue-800 w-8 h-8 flex items-center justify-center rounded-full shrink-0">{i + 1}</span>
                                    {q.question}
                                </h3>
                                <div className="space-y-3 pl-2 md:pl-8">
                                    {q.options.map((opt, optIdx) => (
                                        <div key={optIdx} onClick={() => setAnswers({...answers, [i]: optIdx})} className={`flex items-center p-4 rounded-xl border-2 cursor-pointer transition ${answers[i] === optIdx ? 'bg-blue-50 border-blue-500 shadow-sm ring-1 ring-blue-200' : 'bg-gray-50 border-gray-200 hover:bg-gray-100'}`}>
                                            <div className={`w-5 h-5 rounded-full border-2 ml-4 flex items-center justify-center shrink-0 ${answers[i] === optIdx ? 'border-blue-600' : 'border-gray-400'}`}>
                                                {answers[i] === optIdx && <div className="w-2.5 h-2.5 bg-blue-600 rounded-full"></div>}
                                            </div>
                                            <span className={`text-lg font-medium ${answers[i] === optIdx ? 'text-blue-800' : 'text-gray-700'}`}>{opt}</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>

                    <div className="fixed bottom-0 left-0 right-0 p-4 bg-white border-t border-gray-200 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.1)] z-40">
                        <button onClick={() => { if(confirm("تأكيد التسليم؟")) submitExam(); }} className="w-full max-w-3xl mx-auto block bg-green-500 hover:bg-green-600 text-white font-extrabold text-xl py-4 rounded-xl shadow-lg transition-transform transform active:scale-95">
                            تسليم الإجابات النهائية
                        </button>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
